# Coolify deploy guarantee — every push to dev or main must redeploy.
#
# Coolify's GitHub App auto-deploy is the primary push-to-deploy trigger for
# moderaty-dev (branch dev) and moderaty-prod (branch main), but its webhook
# endpoint (https://<coolify>/webhooks/source/github/events) can silently stop
# being reachable — the documented failure mode for "every commit auto-deploys"
# (docs/COOLIFY_BUNNY.md §1). This workflow makes each push's redeploy
# observable and guaranteed:
#   1. It polls the Coolify API for a deployment queued for the pushed commit.
#   2. If the webhook did not fire within the grace window, it triggers the
#      deployment directly via the API (--fallback) — never a silent no-op.
# When auto-deploy works the workflow only verifies, so it never double-deploys.
#
# Secrets (repository → Settings → Secrets and variables → Actions):
#   COOLIFY_SERVER_URL      e.g. https://coolify.example.com
#   COOLIFY_API_TOKEN       Coolify API token (Token → API tokens)
#   COOLIFY_APP_UUID_DEV    moderaty-dev application UUID (Coolify app URL)
#   COOLIFY_APP_UUID_PROD   moderaty-prod application UUID
# Missing secrets fail the run loudly (like bunny-purge) — by design, so a
# broken guarantee is never invisible.

name: Coolify deploy guarantee

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older verification; the deployments themselves are
# idempotent server-side (each push has its own commit), and one fallback
# trigger per event is the guarantee.
concurrency:
  group: coolify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-or-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # A manual dispatch may target any ref; only dev/main map to a real app
      # (anything else would wait for a SHA the app's branch never deploys —
      # codex P2). Fail loudly instead of silently verifying nothing.
      - name: Reject manual dispatch on unsupported refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
        run: |
          echo "ERROR: workflow_dispatch is only supported on dev or main (got ${{ github.ref }})" >&2
          exit 1
      - name: Verify (or trigger) the Coolify deployment for this push
        env:
          COOLIFY_SERVER_URL: ${{ secrets.COOLIFY_SERVER_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID_DEV: ${{ secrets.COOLIFY_APP_UUID_DEV }}
          COOLIFY_APP_UUID_PROD: ${{ secrets.COOLIFY_APP_UUID_PROD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            APP_UUID="$COOLIFY_APP_UUID_PROD"
          else
            APP_UUID="$COOLIFY_APP_UUID_DEV"
          fi
          # --since: ignore deployments created before THIS PUSH (a force-push
          # back to a previously deployed commit must still redeploy). Anchor to
          # repository.pushed_at — the push occurrence time — NOT
          # head_commit.timestamp, which is the COMMIT's own time: a previous
          # deployment of the same SHA was created after the commit timestamp
          # but before this push, and would wrongly satisfy the poll (human
          # review). For manual dispatch there is no push timestamp, so 'now'
          # forces a fresh deployment, which is the dispatch's purpose.
          if [ "${{ github.event_name }}" = "push" ]; then
            SINCE="${{ github.event.repository.pushed_at }}"
          else
            SINCE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          if [ -z "$APP_UUID" ]; then
            echo "ERROR: COOLIFY_APP_UUID_DEV / COOLIFY_APP_UUID_PROD repository secret is not set (branch ${{ github.ref_name }}). Set it, then re-run." >&2
            exit 1
          fi
          node scripts/coolify-deploy.mjs "$APP_UUID" "${{ github.sha }}" --fallback --since "$SINCE"
