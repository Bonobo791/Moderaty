---
exclude_paths:
  - 'svelte.config.js'
  - '.svelte-kit/**'
  - 'build/**'
  - 'node_modules/**'
engines:
  agentlinter:
    exclude_paths:
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
  # Drizzle migrations target SQLite; TSQLLint rules (schema qualification,
  # SET ANSI options) are T-SQL-specific and do not apply.
  tsqllint:
    exclude_paths:
      - 'drizzle/**'
  # SQLint lints for ANSI portability (double-quoted identifiers, no PRAGMA);
  # drizzle migrations are generated, SQLite-only SQL where those rules do
  # not apply.
  SQLint:
    exclude_paths:
      - 'drizzle/**'
  # Test files use patterns (mock calls, stringified assertions) that trip
  # correctness rules intended for production code.
  opengrep:
    exclude_paths:
      - '**/*.test.ts'
