name: backup-tests
on:
  pull_request:
    branches: [dev, main]
    paths: ['scripts/backup*', 'scripts/backup-lib/**', 'scripts/*backup*.mjs', 'scripts/install-backup-tools.sh', '.github/workflows/*backup*.yml', 'drizzle/**', 'package*.json']
  push:
    branches: ['feat/secure-database-backups-recovery']
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci
      - run: bash scripts/install-backup-tools.sh
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Offline encrypted recovery rehearsal
        run: node scripts/rehearse-backup.mjs
