py of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nconst TIMEOUT_MS = 10_000;\nconst MAX_RETRIES = 3;\n\nexport class DeadlineExceededError extends Error {\n\tconstructor() {\n\t\tsuper('request deadline exceeded');\n\t}\n}\n\n/**\n * Reads a response body as JSON, failing loudly on transport or parse errors.\n *\n * @param response - The HTTP response to read.\n * @param label - The operation name used in error messages (e.g. 'moderation').\n * @returns The parsed JSON body.\n * @throws If the response status is not OK or the body is not valid JSON.\n */\nexport async function jsonResponse(response: Response, label: string): Promise<"+"unknown> {\n\tconst body = await response.text();\n\tif (!response.ok) throw new Error(`${label} failed: ${response.status} ${body}`);\n\ttry {\n\t\treturn JSON.parse(body) as unknown;\n\t} catch {\n\t\tthrow new Error(`${label} returned invalid JSON`);\n\t}\n}\n\n/**\n * Ensures the current time is before the specified deadline.\n *\n * @param deadline - The time limit, expressed as milliseconds since the Unix epoch.\n * @throws DeadlineExceededError if the deadline has been reached or passed.\n */\nexport function assertBeforeDeadline(deadline?: number) {\n\tif (\n\t\t// Stryker disable next-line ConditionalExpression: `deadline !== undefined` -> `true` is equivalent — `Date.now() >= undefined` is always false, so the && result is unchanged; the directive also sweeps the killable whole-condition siblings that start on the same line\n\t\tdeadline !== undefined &&\n\t\tDate.now() >= deadline\n\t) throw new DeadlineExceededError();\n}\n\n/**\n * Determines the delay before the next retry attempt.\n *\n * @param response - The response containing an optional `Retry-After` header\n * @param retry - The zero-based retry attempt number\n * @returns The delay in milliseconds\n */\nfunction retryDelay(response: Response | undefined, retry: number): number {\n\tconst retryAfter = response?.headers.get('retry-after');\n\tif (retryAfter) {\n\t\tconst seconds = Number(retryAfter);\n\t\tif (Number.isFinite(seconds)) return Math.max(0, seconds * 1000);\n\t\tconst date = Date.parse(retryAfter);\n\t\tif (!Number.isNaN(date)) return Math.max(0, date - Date.now());\n\t}\n\treturn Math.min(1_000 * 2 ** retry, 10_000);\n}\n\n/**\n * Determines whether an HTTP response or failed request can be retried.\n *\n * @param response - The response to evaluate, or `undefined` when no response was received\n * @returns `true` if no response was received or the status indicates throttling or a server error, `false` otherwise\n */\nfunction retryable(response: Response | undefined): boolean {\n\treturn (\n\t\t// Stryker disable next-line ConditionalExpression: the only call site (fetchWithRetry) guards with `response &&` before invoking retryable, so `response === undefined` can never be observed here; the directive also sweeps the killable whole-chain and sub-chain siblings that start on the same line\n\t\tresponse === undefined ||\n\t\tresponse.status === 429 ||\n\t\tresponse.status >= 500\n\t);\n}\n\nfunction requestTimeout(deadline?: number): number {\n\tconst remaining = deadline === undefined ? TIMEOUT_MS : Math.min(TIMEOUT_MS, deadline - Date.now());\n\tif (remaining <"+"= 0) throw new DeadlineExceededError();\n\treturn remaining;\n}\n\ntype FetchAttempt = { response: Response } | { error: unknown };\n\nasync function fetchAttempt(input: RequestInfo | URL, init: RequestInit, deadline?: number): Promise<"+"FetchAttempt> {\n\ttry {\n\t\tconst timeout = AbortSignal.timeout(requestTimeout(deadline));\n\t\tconst signal = init.signal ? AbortSignal.any([init.signal, timeout]) : timeout;\n\t\treturn { response: await fetch(input, { ...init, signal }) };\n\t} catch (error) {\n\t\tif (init.signal?.aborted) throw error;\n\t\tif (\n\t\t\t// Stryker disable next-line ConditionalExpression: `deadline !== undefined` -> `true` is equivalent — `Date.now() >= undefined` is always false, so the && result is unchanged; the directive also sweeps the killable whole-condition siblings that start on the same line\n\t\t\tdeadline !== undefined &&\n\t\t\tDate.now() >= deadline\n\t\t) throw new DeadlineExceededError();\n\t\treturn { error };\n\t}\n}\n\nfunction boundedRetryDelay(response: Response | undefined, retry: number, deadline?: number): number {\n\tconst delay = retryDelay(response, retry);\n\treturn deadline === undefined ? delay : Math.min(delay, Math.max(0, deadline - Date.now()));\n}\n\n/**\n * Fetches a resource with bounded retries and optional deadline enforcement.\n *\n * @param input - The request resource to fetch.\n * @param deadline - An absolute time in milliseconds after which the request fails with `DeadlineExceededError`.\n * @returns The first non-retryable response, or the final response after retries are exhausted.\n * @throws `DeadlineExceededError` when the deadline is reached before or during a request.\n */\nexport async function fetchWithRetry(\n\tinput: RequestInfo | URL,\n\tinit: RequestInit = {},\n\tdeadline?: number\n): Promise<"+"Response> {\n\tfor (let retry = 0; ; retry++) {\n\t\tconst attempt = await fetchAttempt(input, init, deadline);\n\t\tconst response = 'response' in attempt ? attempt.response : undefined;\n\t\tif (response && !retryable(response)) return response;\n\t\tif (retry === MAX_RETRIES) {\n\t\t\tif ('error' in attempt) throw attempt.error;\n\t\t\treturn attempt.response;\n\t\t}\n\t\tawait new Promise((resolve) => setTimeout(resolve, boundedRetryDelay(response, retry, deadline)));\n\t}\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":null},"testFiles":{"src/routes/(app)/org/page.server.test.ts":{"tests":[{"id":"0","name":"load: a database outage returns the maintenance payload instead of a 401"},{"id":"1","name":"load: 401 signed out; members get the roster but no invites; admins get open invites"},{"id":"2","name":"load: a membership whose org row vanished still renders with hasOpenAiKey false instead of throwing"},{"id":"3","name":"rename: member is a raw 403; owner errors are wrapped as form failures"},{"id":"4","name":"createTeam: bad name fails loudly; success creates a shared org the user owns"},{"id":"5","name":"invite: member is 403; bad role is a 400 failure; success returns the token"},{"id":"6","name":"invite: a corrupted membership role rethrows raw through guard instead of a fake form failure"},{"id":"7","name":"revokeInvite: member is 403; unknown token is a wrapped 404"},{"id":"8","name":"revokeInvite: owner revokes an open invite by token"},{"id":"9","name":"setRole: non-owner is 403; last-owner demotion is a wrapped 400"},{"id":"10","name":"remove: self-removal is a wrapped 400 pointing at Leave team"},{"id":"11","name":"leave: missing cookie fails 401; sole member is a wrapped 400"},{"id":"12","name":"leave: a successful leave 303s to the dashboard (post-leave /org would 404 on the stale locals)"},{"id":"13","name":"setRole: an invalid role from the form is a wrapped 400, never cast through"},{"id":"14","name":"remove: a member caller is 403 at the route, same as the other admin-gated actions"},{"id":"15","name":"setOpenAiKey: owner stores an encrypted key after live validation; the page only ever exposes a boolean"},{"id":"16","name":"setOpenAiKey: non-owner is 403 and nothing is stored or validated"},{"id":"17","name":"setOpenAiKey: a key without the sk- prefix fails 400 before any OpenAI call"},{"id":"18","name":"setOpenAiKey: surrounding whitespace is trimmed before validation and storage"},{"id":"19","name":"setOpenAiKey: keys over 200 characters are rejected; exactly 200 is accepted"},{"id":"20","name":"setOpenAiKey: OpenAI rejecting the key fails 400 and stores nothing"},{"id":"21","name":"setOpenAiKey: OpenAI forbidding the key (403) fails 400 and stores nothing"},{"id":"22","name":"setOpenAiKey: an OpenAI server error fails 502, logs the status, and stores nothing"},{"id":"23","name":"setOpenAiKey: an unreachable OpenAI fails 502 and logs only a message, never the key or a raw error object"},{"id":"24","name":"clearOpenAiKey: owner wipes the stored key; non-owner is 403"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { eq } from 'drizzle-orm';\nimport { afterEach, expect, test, vi } from 'vitest';\n\nconst mocks = vi.hoisted(() => ({\n\tenv: { ENCRYPTION_KEY: 'test-encryption-key' } as Record<"+"string, string | undefined>\n}));\n\nvi.mock('$env/dynamic/private', () => ({ env: mocks.env }));\n\n// testdb must be the first app import: it registers the $lib/server/db mock\n// before any module that binds the real database (see its header comment).\nimport { postForm, setupTestDb, TEST_OWNER, testDb } from '$lib/server/testdb';\nimport { invites, memberships, organizations, sessions, users } from '$lib/server/db/schema';\nimport { decrypt } from '$lib/server/crypto';\nimport { SESSION_COOKIE, type SessionUser } from '$lib/server/session';\nimport { makeCookies } from '$lib/server/testcookies';\n\nimport { actions, load } from './+page.server';\n\nsetupTestDb(['sessions', 'invites', 'memberships', 'organizations', 'users']);\n\nconst MEMBER: SessionUser = { ...TEST_OWNER, orgRole: 'member' };\nconst ADMIN: SessionUser = { ...TEST_OWNER, orgRole: 'admin' };\n\nasync function seedOwnerOrg() {\n\tawait testDb()\n\t\t.db.insert(users)\n\t\t.values({ id: TEST_OWNER.id, googleSub: 'sub-user-1', email: TEST_OWNER.email, displayName: TEST_OWNER.displayName });\n\tawait testDb().db.insert(organizations).values({ id: 'org-1', name: 'One' });\n\tawait testDb().db.insert(memberships).values({ userId: TEST_OWNER.id, orgId: 'org-1', role: 'owner' });\n}\n\n/** Adds a second user as a member of org-1 (shares user-1's session fixtures as needed). */\nasync function seedTeammate(userId: string, role: 'admin' | 'member' = 'member') {\n\tawait testDb()\n\t\t.db.insert(users)\n\t\t.values({ id: userId, googleSub: `sub-${userId}`, email: `${userId}@example.com`, displayName: userId });\n\tawait testDb().db.insert(memberships).values({ userId, orgId: 'org-1', role });\n}\n\nfunction ctx(user: SessionUser | null, fields: Record<"+"string, string> = {}, withCookie = true) {\n\tconst cookies = makeCookies();\n\tif (withCookie) cookies.set(SESSION_COOKIE, 'sess-1', { path: '/' });\n\treturn {\n\t\trequest: postForm(fields, 'http://localhost/org'),\n\t\tlocals: { user },\n\t\tcookies,\n\t\turl: new URL('http://localhost/org')\n\t} as never;\n}\n\nfunction failure(result: unknown): { status: number; data: { error: string } } {\n\treturn result as { status: number; data: { error: string } };\n}\n\ntest('load: a database outage returns the maintenance payload instead of a 401', async () => {\n\t// The layout renders the overlay; the org load must not throw on the\n\t// null-user outage shape.\n\tconst outageCtx = { locals: { user: null, dbDown: true }, url: new URL('http://localhost/org') } as never;\n\tconst data = (await load(outageCtx)) as {\n\t\tmaintenance: boolean;\n\t\tmembers: unknown[];\n\t\tinvites: unknown[];\n\t\tuser: unknown;\n\t\tinviteBase: string;\n\t\thasOpenAiKey: boolean;\n\t};\n\texpect(data.maintenance).toBe(true);\n\texpect(data.user).toBeNull();\n\texpect(data.members).toEqual([]);\n\texpect(data.invites).toEqual([]);\n\texpect(data.inviteBase).toBe('http://localhost/invite/');\n\texpect(data.hasOpenAiKey).toBe(false);\n});\n\ntest('load: 401 signed out; members get the roster but no invites; admins get open invites', async () => {\n\tawait seedOwnerOrg();\n\tawait seedTeammate('user-2');\n\tawait testDb().db.insert(invites).values({\n\t\ttoken: 'tok-1',\n\t\torgId: 'org-1',\n\t\trole: 'member',\n\t\tcreatedBy: TEST_OWNER.id,\n\t\texpiresAt: '2099-01-01T00:00:00.000Z'\n\t});\n\n\tawait expect(load(ctx(null))).rejects.toMatchObject({ status: 401 });\n\n\tconst ownerView = (await load(ctx(TEST_OWNER))) as { members: unknown[]; invites: unknown[]; inviteBase: string };\n\texpect(ownerView.members).toHaveLength(2);\n\texpect(ownerView.invites).toHaveLength(1);\n\texpect(ownerView.inviteBase).toBe('http://localhost/invite/');\n\n\tconst memberView = (await load(ctx(MEMBER))) as { members: unknown[]; invites: unknown[] };\n\texpect(memberView.members).toHaveLength(2);\n\texpect(memberView.invites).toEqual([]); // member role never sees invite management\n\n\tconst adminView = (await load(ctx(ADMIN))) as { members: unknown[]; invites: unknown[] };\n\texpect(adminView.members).toHaveLength(2);\n\texpect(adminView.invites).toHaveLength(1); // admins see invite management, same as owners\n});\n\ntest('load: a membership whose org row vanished still renders with hasOpenAiKey false instead of throwing', async () => {\n\t// The key lookup is a separate query from the roster; a missing org row\n\t// (data bug) must degrade to the boolean, never crash the page.\n\tawait seedOwnerOrg();\n\tawait testDb().client.execute('PRAGMA foreign_keys = OFF');\n\ttry {\n\t\tawait testDb().db.delete(organizations).where(eq(organizations.id, 'org-1'));\n\t} finally {\n\t\tawait testDb().client.execute('PRAGMA foreign_keys = ON');\n\t}\n\tconst view = (await load(ctx(TEST_OWNER))) as { members: unknown[]; hasOpenAiKey: boolean };\n\texpect(view.members).toHaveLength(1);\n\texpect(view.hasOpenAiKey).toBe(false);\n});\n\ntest('rename: member is a raw 403; owner errors are wrapped as form failures', async () => {\n\tawait seedOwnerOrg();\n\tawait expect(actions.rename(ctx(MEMBER, { name: 'New' }))).rejects.toMatchObject({ status: 403 });\n\n\tconst bad = failure(await actions.rename(ctx(TEST_OWNER, { name: '' })));\n\texpect(bad.status).toBe(400);\n\texpect(bad.data.error).toContain('1–80');\n\n\tconst missing = failure(await actions.rename(ctx(TEST_OWNER, {})));\n\texpect(missing.status).toBe(400);\n\n\tawait actions.rename(ctx(TEST_OWNER, { name: 'Renamed' }));\n\tconst org = await testDb().db.select().from(organizations).where(eq(organizations.id, 'org-1')).get();\n\texpect(org?.name).toBe('Renamed');\n});\n\ntest('createTeam: bad name fails loudly; success creates a shared org the user owns', async () => {\n\tawait seedOwnerOrg();\n\tconst bad = failure(await actions.createTeam(ctx(TEST_OWNER, { name: '   ' })));\n\texpect(bad.status).toBe(400);\n\n\tconst missing = failure(await actions.createTeam(ctx(TEST_OWNER, {})));\n\texpect(missing.status).toBe(400);\n\n\tawait actions.createTeam(ctx(TEST_OWNER, { name: 'Second Team' }));\n\tconst mine = await testDb().db.select().from(memberships).where(eq(memberships.userId, TEST_OWNER.id)).all();\n\texpect(mine).toHaveLength(2);\n\tconst created = mine.find((m) => m.orgId !== 'org-1');\n\tconst newOrg = await testDb().db.select().from(organizations).where(eq(organizations.id, created!.orgId)).get();\n\texpect(newOrg?.name).toBe('Second Team');\n\texpect(newOrg?.personalFor).toBeNull();\n});\n\ntest('invite: member is 403; bad role is a 400 failure; success returns the token', async () => {\n\tawait seedOwnerOrg();\n\tawait expect(actions.invite(ctx(MEMBER, { role: 'member' }))).rejects.toMatchObject({ status: 403 });\n\n\tconst badRole = failure(await actions.invite(ctx(TEST_OWNER, { role: 'owner' })));\n\texpect(badRole.status).toBe(400);\n\texpect(badRole.data.error).toBe('role must be admin or member');\n\n\tconst good = (await actions.invite(ctx(TEST_OWNER, { role: 'admin' }))) as { ok: true; inviteToken: string };\n\texpect(good.ok).toBe(true);\n\tconst row = await testDb().db.select().from(invites).where(eq(invites.token, good.inviteToken)).get();\n\texpect(row?.role).toBe('admin');\n\n\t// A member invite is valid too, and a missing role field defaults to member.\n\tconst memberInvite = (await actions.invite(ctx(TEST_OWNER, { role: 'member' }))) as {\n\t\tok: true;\n\t\tinviteToken: string;\n\t};\n\tconst memberRow = await testDb().db.select().from(invites).where(eq(invites.token, memberInvite.inviteToken)).get();\n\texpect(memberRow?.role).toBe('member');\n\n\tconst defaulted = (await actions.invite(ctx(TEST_OWNER, {}))) as { ok: true; inviteToken: string };\n\tconst defaultedRow = await testDb().db.select().from(invites).where(eq(invites.token, defaulted.inviteToken)).get();\n\texpect(defaultedRow?.role).toBe('member');\n});\n\ntest('invite: a corrupted membership role rethrows raw through guard instead of a fake form failure', async () => {\n\t// memberships.role has no CHECK constraint; a corrupt value is a data bug\n\t// and must propagate (asOrgRole's plain Error), not be swallowed into a\n\t// status-less ActionFailure.\n\tawait seedOwnerOrg();\n\tawait testDb()\n\t\t.db.insert(users)\n\t\t.values({ id: 'user-9', googleSub: 'sub-user-9', email: 'user-9@example.com', displayName: 'user-9' });\n\tawait testDb().db.insert(memberships).values({ userId: 'user-9', orgId: 'org-1', role: 'bogus' });\n\tconst corrupted: SessionUser = { ...TEST_OWNER, id: 'user-9' };\n\tawait expect(actions.invite(ctx(corrupted, { role: 'member' }))).rejects.toThrow(\n\t\t'unknown membership role: bogus'\n\t);\n});\n\ntest('revokeInvite: member is 403; unknown token is a wrapped 404', async () => {\n\tawait seedOwnerOrg();\n\tawait expect(actions.revokeInvite(ctx(MEMBER, { token: 'tok-1' }))).rejects.toMatchObject({ status: 403 });\n\tconst gone = failure(await actions.revokeInvite(ctx(TEST_OWNER, { token: 'tok-nope' })));\n\texpect(gone.status).toBe(404);\n\n\t// A missing token field takes the same 404 path as any nonexistent token.\n\tconst noField = failure(await actions.revokeInvite(ctx(TEST_OWNER, {})));\n\texpect(noField.status).toBe(404);\n});\n\ntest('revokeInvite: owner revokes an open invite by token', async () => {\n\tawait seedOwnerOrg();\n\tawait testDb().db.insert(invites).values({\n\t\ttoken: 'tok-1',\n\t\torgId: 'org-1',\n\t\trole: 'member',\n\t\tcreatedBy: TEST_OWNER.id,\n\t\texpiresAt: '2099-01-01T00:00:00.000Z'\n\t});\n\tawait actions.revokeInvite(ctx(TEST_OWNER, { token: 'tok-1' }));\n\tconst gone = await testDb().db.select().from(invites).where(eq(invites.token, 'tok-1')).get();\n\texpect(gone).toBeUndefined();\n});\n\ntest('setRole: non-owner is 403; last-owner demotion is a wrapped 400', async () => {\n\tawait seedOwnerOrg();\n\tconst admin: SessionUser = { ...TEST_OWNER, orgRole: 'admin' };\n\tawait expect(actions.setRole(ctx(admin, { userId: 'user-2', role: 'member' }))).rejects.toMatchObject({ status: 403 });\n\n\tconst demote = failure(await actions.setRole(ctx(TEST_OWNER, { userId: TEST_OWNER.id, role: 'member' })));\n\texpect(demote.status).toBe(400);\n\texpect(demote.data.error).toContain('last owner');\n\n\t// A missing userId field is a wrapped 404, never cast through.\n\tconst noTarget = failure(await actions.setRole(ctx(TEST_OWNER, { role: 'admin' })));\n\texpect(noTarget.status).toBe(404);\n});\n\ntest('remove: self-removal is a wrapped 400 pointing at Leave team', async () => {\n\tawait seedOwnerOrg();\n\tconst self = failure(await actions.remove(ctx(TEST_OWNER, { userId: TEST_OWNER.id })));\n\texpect(self.status).toBe(400);\n\texpect(self.data.error).toContain('Leave team');\n\n\t// A missing userId field is a wrapped 404, never cast through.\n\tconst noTarget = failure(await actions.remove(ctx(TEST_OWNER, {})));\n\texpect(noTarget.status).toBe(404);\n\n\tawait seedTeammate('user-2');\n\tawait actions.remove(ctx(TEST_OWNER, { userId: 'user-2' }));\n\tconst gone = await testDb()\n\t\t.db.select()\n\t\t.from(memberships)\n\t\t.where(eq(memberships.userId, 'user-2'))\n\t\t.all();\n\texpect(gone).toHaveLength(0);\n});\n\ntest('leave: missing cookie fails 401; sole member is a wrapped 400', async () => {\n\tawait seedOwnerOrg();\n\tconst noCookie = failure(await actions.leave(ctx(TEST_OWNER, {}, false)));\n\texpect(noCookie.status).toBe(401);\n\texpect(noCookie.data.error).toBe('sign-in required');\n\n\tconst sole = failure(await actions.leave(ctx(TEST_OWNER)));\n\texpect(sole.status).toBe(400);\n\texpect(sole.data.error).toContain('only member');\n});\n\ntest('leave: a successful leave 303s to the dashboard (post-leave /org would 404 on the stale locals)', async () => {\n\t// PR #52 review (Codacy): locals are frozen for the request, so rendering\n\t// /org after leaving the active team would re-list members of the team the\n\t// user just left and 404. Redirect to a fresh request instead.\n\tawait seedOwnerOrg();\n\t// A second owner in org-1, so leaving is permitted.\n\tawait testDb()\n\t\t.db.insert(users)\n\t\t.values({ id: 'user-2', googleSub: 'sub-user-2', email: 'user-2@example.com', displayName: 'user-2' });\n\tawait testDb().db.insert(memberships).values({ userId: 'user-2', orgId: 'org-1', role: 'owner' });\n\tawait testDb()\n\t\t.db.insert(sessions)\n\t\t.values({ id: 'sess-1', userId: TEST_OWNER.id, activeOrgId: 'org-1', expiresAt: '2099-01-01T00:00:00.000Z' });\n\n\tawait expect(actions.leave(ctx(TEST_OWNER))).rejects.toMatchObject({ status: 303, location: '/dashboard' });\n\tconst gone = await testDb().db.select().from(memberships).where(eq(memberships.userId, TEST_OWNER.id)).all();\n\texpect(gone).toHaveLength(0);\n\tconst sess = await testDb().db.select().from(sessions).where(eq(sessions.id, 'sess-1')).get();\n\texpect(sess?.activeOrgId).toBeNull();\n});\n\ntest('setRole: an invalid role from the form is a wrapped 400, never cast through', async () => {\n\t// PR #52 review (CodeRabbit): the action passed a raw form string into\n\t// setMemberRole; the lib rejects unknown roles, and the route must surface\n\t// that as a form failure.\n\tawait seedOwnerOrg();\n\tawait seedTeammate('user-2');\n\tconst bad = failure(await actions.setRole(ctx(TEST_OWNER, { userId: 'user-2', role: 'superadmin' })));\n\texpect(bad.status).toBe(400);\n\tconst kept = await testDb().db.select().from(memberships).where(eq(memberships.userId, 'user-2')).all();\n\texpect(kept[0].role).toBe('member');\n});\n\ntest('remove: a member caller is 403 at the route, same as the other admin-gated actions', async () => {\n\t// PR #52 review (CodeRabbit): remove was the only admin-gated action\n\t// without a route-level requireOrgRole.\n\tawait seedOwnerOrg();\n\tawait seedTeammate('user-2');\n\tawait expect(actions.remove(ctx(MEMBER, { userId: 'user-2' }))).rejects.toMatchObject({ status: 403 });\n});\n\nafterEach(() => {\n\tvi.unstubAllGlobals();\n});\n\n/** Stubs global fetch (the live OpenAI key check) and records each call. */\nfunction stubOpenAi(status: number) {\n\tconst calls: { url: unknown; init: RequestInit | undefined }[] = [];\n\tvi.stubGlobal('fetch', async (url: unknown, init?: RequestInit) => {\n\t\tcalls.push({ url, init });\n\t\treturn new Response('{}', { status });\n\t});\n\treturn calls;\n}\n\nasync function storedKey(orgId = 'org-1') {\n\tconst org = await testDb().db.select().from(organizations).where(eq(organizations.id, orgId)).get();\n\treturn org?.openaiKeyEnc ?? null;\n}\n\ntest('setOpenAiKey: owner stores an encrypted key after live validation; the page only ever exposes a boolean', async () => {\n\tawait seedOwnerOrg();\n\tconst calls = stubOpenAi(200);\n\n\tconst res = await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'sk-test-org-key' }));\n\texpect(res).toMatchObject({ ok: true });\n\n\tconst ciphertext = await storedKey();\n\texpect(ciphertext).toBeTruthy();\n\texpect(ciphertext).not.toContain('sk-test-org-key');\n\texpect(decrypt(ciphertext!)).toBe('sk-test-org-key');\n\texpect(calls[0].url).toBe('https://api.openai.com/v1/models');\n\texpect(calls[0].init?.headers).toMatchObject({ authorization: 'Bearer sk-test-org-key' });\n\n\t// Never serialize secrets to the client: only the boolean leaves the server.\n\tconst view = (await load(ctx(TEST_OWNER))) as Record<"+"string, unknown>;\n\texpect(view.hasOpenAiKey).toBe(true);\n\tconst serialized = JSON.stringify(view);\n\texpect(serialized).not.toContain('sk-test-org-key');\n\texpect(serialized).not.toContain(ciphertext!);\n});\n\ntest('setOpenAiKey: non-owner is 403 and nothing is stored or validated', async () => {\n\tawait seedOwnerOrg();\n\tconst calls = stubOpenAi(200);\n\tawait expect(actions.setOpenAiKey(ctx(MEMBER, { openAiKey: 'sk-x' }))).rejects.toMatchObject({ status: 403 });\n\texpect(await storedKey()).toBeNull();\n\texpect(calls).toHaveLength(0);\n});\n\ntest('setOpenAiKey: a key without the sk- prefix fails 400 before any OpenAI call', async () => {\n\tawait seedOwnerOrg();\n\tconst calls = stubOpenAi(200);\n\tconst bad = failure(await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'not-a-key' })));\n\texpect(bad.status).toBe(400);\n\texpect(bad.data.error).toBe('Enter a valid OpenAI API key (it starts with sk-).');\n\texpect(await storedKey()).toBeNull();\n\texpect(calls).toHaveLength(0);\n\n\t// A missing field fails the same way.\n\tconst missing = failure(await actions.setOpenAiKey(ctx(TEST_OWNER, {})));\n\texpect(missing.status).toBe(400);\n\texpect(missing.data.error).toBe('Enter a valid OpenAI API key (it starts with sk-).');\n});\n\ntest('setOpenAiKey: surrounding whitespace is trimmed before validation and storage', async () => {\n\tawait seedOwnerOrg();\n\tconst calls = stubOpenAi(200);\n\tconst res = await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: '  sk-trimmed-key  ' }));\n\texpect(res).toMatchObject({ ok: true });\n\texpect(decrypt((await storedKey())!)).toBe('sk-trimmed-key');\n\texpect(calls[0].init?.headers).toMatchObject({ authorization: 'Bearer sk-trimmed-key' });\n});\n\ntest('setOpenAiKey: keys over 200 characters are rejected; exactly 200 is accepted', async () => {\n\tawait seedOwnerOrg();\n\tconst calls = stubOpenAi(200);\n\tconst tooLong = failure(await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: `sk-${'x'.repeat(198)}` })));\n\texpect(tooLong.status).toBe(400);\n\texpect(tooLong.data.error).toBe('Enter a valid OpenAI API key (it starts with sk-).');\n\texpect(await storedKey()).toBeNull();\n\n\tconst boundary = await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: `sk-${'x'.repeat(197)}` }));\n\texpect(boundary).toMatchObject({ ok: true });\n\texpect(decrypt((await storedKey())!)).toBe(`sk-${'x'.repeat(197)}`);\n\t// Only the boundary key reached OpenAI; the over-long key never left the server.\n\texpect(calls).toHaveLength(1);\n});\n\ntest('setOpenAiKey: OpenAI rejecting the key fails 400 and stores nothing', async () => {\n\tawait seedOwnerOrg();\n\tstubOpenAi(401);\n\tconst bad = failure(await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'sk-bad-key' })));\n\texpect(bad.status).toBe(400);\n\texpect(bad.data.error).toBe('OpenAI rejected that key — check it and try again.');\n\texpect(await storedKey()).toBeNull();\n});\n\ntest('setOpenAiKey: OpenAI forbidding the key (403) fails 400 and stores nothing', async () => {\n\tawait seedOwnerOrg();\n\tstubOpenAi(403);\n\tconst bad = failure(await actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'sk-forbidden' })));\n\texpect(bad.status).toBe(400);\n\texpect(bad.data.error).toBe('OpenAI rejected that key — check it and try again.');\n\texpect(await storedKey()).toBeNull();\n});\n\ntest('setOpenAiKey: an OpenAI server error fails 502, logs the status, and stores nothing', async () => {\n\tawait seedOwnerOrg();\n\tstubOpenAi(500);\n\tconst spy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tvi.useFakeTimers();\n\ttry {\n\t\tconst pending = actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'sk-server-error' }));\n\t\tawait vi.advanceTimersByTimeAsync(20_000); // fetchWithRetry backoff on 5xx\n\t\tconst bad = failure(await pending);\n\t\texpect(bad.status).toBe(502);\n\t\texpect(bad.data.error).toBe('OpenAI could not validate the key right now — try again in a moment.');\n\t} finally {\n\t\tvi.useRealTimers();\n\t}\n\texpect(await storedKey()).toBeNull();\n\texpect(spy).toHaveBeenCalledWith('OpenAI key validation returned a non-OK status:', 500);\n});\n\ntest('setOpenAiKey: an unreachable OpenAI fails 502 and logs only a message, never the key or a raw error object', async () => {\n\t// CWE-532: the caught fetch error is an object whose dump can carry request\n\t// detail; the log must be a plain message string so the key can never leak.\n\tawait seedOwnerOrg();\n\tvi.stubGlobal('fetch', async () => {\n\t\tthrow new Error('fetch failed');\n\t});\n\tconst spy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tvi.useFakeTimers();\n\ttry {\n\t\tconst pending = actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'sk-secret-key' }));\n\t\tawait vi.advanceTimersByTimeAsync(20_000); // fetchWithRetry backoff\n\t\tconst bad = failure(await pending);\n\t\texpect(bad.status).toBe(502);\n\t\texpect(bad.data.error).toBe('Could not reach OpenAI to validate the key — try again in a moment.');\n\t} finally {\n\t\tvi.useRealTimers();\n\t}\n\texpect(await storedKey()).toBeNull();\n\texpect(spy).toHaveBeenCalled();\n\texpect(spy).toHaveBeenCalledWith('OpenAI key validation request failed:', 'fetch failed');\n\tfor (const call of spy.mock.calls) {\n\t\tfor (const arg of call) expect(arg).not.toBeInstanceOf(Error);\n\t\texpect(JSON.stringify(call)).not.toContain('sk-secret-key');\n\t}\n});\n\ntest('clearOpenAiKey: owner wipes the stored key; non-owner is 403', async () => {\n\tawait seedOwnerOrg();\n\tstubOpenAi(200);\n\tawait actions.setOpenAiKey(ctx(TEST_OWNER, { openAiKey: 'sk-test-org-key' }));\n\texpect(await storedKey()).toBeTruthy();\n\n\tawait expect(actions.clearOpenAiKey(ctx(MEMBER))).rejects.toMatchObject({ status: 403 });\n\texpect(await storedKey()).toBeTruthy();\n\n\tconst cleared = await actions.clearOpenAiKey(ctx(TEST_OWNER));\n\texpect(cleared).toMatchObject({ ok: true });\n\texpect(await storedKey()).toBeNull();\n\tconst view = (await load(ctx(TEST_OWNER))) as { hasOpenAiKey: boolean };\n\texpect(view.hasOpenAiKey).toBe(false);\n});\n"},"src/lib/server/http.test.ts":{"tests":[{"id":"25","name":"retries transient responses but not client errors"},{"id":"26","name":"caps retry sleeps at the remaining deadline"},{"id":"27","name":"fails before fetching when the deadline has passed"},{"id":"28","name":"honours a caller-provided abort signal instead of overwriting it"},{"id":"29","name":"honours Retry-After in seconds"},{"id":"30","name":"retries server errors and network failures"},{"id":"31","name":"assertBeforeDeadline passes with no deadline or a future one"},{"id":"32","name":"assertBeforeDeadline throws once the deadline is reached"},{"id":"33","name":"backs off exponentially when a retryable response has no Retry-After header"},{"id":"34","name":"honours Retry-After as an HTTP date and ignores an unparseable value"},{"id":"35","name":"fails immediately without a retry sleep when an error surfaces at the deadline"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { afterEach, expect, test, vi } from 'vitest';\nimport { assertBeforeDeadline, DeadlineExceededError, fetchWithRetry } from './http';\n\nafterEach(() => {\n\tvi.unstubAllGlobals();\n\t// Restore spies BEFORE swapping real timers back in: a setTimeout spy\n\t// captured the fake timer as its \"original\", so restoring after\n\t// useRealTimers would reinstall the fake one for the next test.\n\tvi.restoreAllMocks();\n\tvi.useRealTimers();\n});\n\ntest('retries transient responses but not client errors', async () => {\n\n\tlet calls = 0;\n\tvi.stubGlobal('fetch', async () => {\n\t\tcalls++;\n\t\treturn calls === 1\n\t\t\t? new Response('', { status: 429, headers: { 'Retry-After': '0' } })\n\t\t\t: new Response('', { status: 200 });\n\t});\n\texpect((await fetchWithRetry('https://example.test')).status).toBe(200);\n\texpect(calls).toBe(2);\n\n\tcalls = 0;\n\tvi.stubGlobal('fetch', async () => {\n\t\tcalls++;\n\t\treturn new Response('', { status: 400 });\n\t});\n\texpect((await fetchWithRetry('https://example.test')).status).toBe(400);\n\texpect(calls).toBe(1);\n});\n\ntest('caps retry sleeps at the remaining deadline', async () => {\n\tvi.useFakeTimers();\n\tconst setTimeoutSpy = vi.spyOn(globalThis, 'setTimeout');\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('', {\n\t\tstatus: 429,\n\t\theaders: { 'Retry-After': '60' }\n\t})));\n\n\tvoid fetchWithRetry('https://example.test', {}, Date.now() + 10).catch(() => undefined);\n\tawait vi.advanceTimersByTimeAsync(0);\n\n\texpect(setTimeoutSpy).toHaveBeenLastCalledWith(expect.any(Function), 10);\n});\n\ntest('fails before fetching when the deadline has passed', async () => {\n\tconst fetch = vi.fn();\n\tvi.stubGlobal('fetch', fetch);\n\n\tawait expect(fetchWithRetry('https://example.test', {}, Date.now())).rejects.toThrow(\n\t\t'request deadline exceeded'\n\t);\n\texpect(fetch).not.toHaveBeenCalled();\n});\n\ntest('honours a caller-provided abort signal instead of overwriting it', async () => {\n\t// I5: the caller's signal must be composed into the request, not replaced\n\t// by the timeout signal — and a caller abort must not be retried.\n\tconst controller = new AbortController();\n\tcontroller.abort();\n\tconst fetch = vi.fn().mockImplementation((_input: unknown, init?: RequestInit) =>\n\t\tinit?.signal?.aborted\n\t\t\t? Promise.reject(new DOMException('The operation was aborted.', 'AbortError'))\n\t\t\t: Promise.resolve(new Response('', { status: 200 }))\n\t);\n\tvi.stubGlobal('fetch', fetch);\n\n\tawait expect(fetchWithRetry('https://example.test', { signal: controller.signal })).rejects.toThrow(\n\t\t'aborted'\n\t);\n\texpect(fetch).toHaveBeenCalledTimes(1);\n});\n\ntest('honours Retry-After in seconds', async () => {\n\tvi.useFakeTimers();\n\tvi.stubGlobal('fetch', vi.fn()\n\t\t.mockResolvedValueOnce(new Response('', { status: 429, headers: { 'Retry-After': '2' } }))\n\t\t.mockResolvedValue(new Response('', { status: 200 })));\n\n\t// Seconds, not milliseconds — treating the header as ms hammers a\n\t// throttled API a thousand times faster than it asked for.\n\tconst promise = fetchWithRetry('https://example.test');\n\tlet settled = false;\n\tvoid promise.then(() => {\n\t\tsettled = true;\n\t});\n\tawait vi.advanceTimersByTimeAsync(1999);\n\texpect(settled).toBe(false);\n\tawait vi.advanceTimersByTimeAsync(1);\n\texpect(settled).toBe(true);\n\texpect((await promise).status).toBe(200);\n});\n\ntest('retries server errors and network failures', async () => {\n\tlet calls = 0;\n\tvi.stubGlobal('fetch', async () => {\n\t\tcalls++;\n\t\treturn calls === 1\n\t\t\t? new Response('', { status: 500, headers: { 'Retry-After': '0' } })\n\t\t\t: new Response('', { status: 200 });\n\t});\n\texpect((await fetchWithRetry('https://example.test')).status).toBe(200);\n\texpect(calls).toBe(2);\n\n\tcalls = 0;\n\tvi.stubGlobal('fetch', async () => {\n\t\tcalls++;\n\t\tif (calls === 1) throw new TypeError('fetch failed');\n\t\treturn new Response('', { status: 200 });\n\t});\n\t// The deadline bounds the exponential sleep while leaving room for the retry.\n\texpect((await fetchWithRetry('https://example.test', {}, Date.now() + 1100)).status).toBe(200);\n\texpect(calls).toBe(2);\n});\n\ntest('assertBeforeDeadline passes with no deadline or a future one', () => {\n\texpect(() => assertBeforeDeadline()).not.toThrow();\n\texpect(() => assertBeforeDeadline(Date.now() + 60_000)).not.toThrow();\n});\n\ntest('assertBeforeDeadline throws once the deadline is reached', () => {\n\texpect(() => assertBeforeDeadline(Date.now() - 1)).toThrow(DeadlineExceededError);\n\texpect(() => assertBeforeDeadline(Date.now() - 1)).toThrow('request deadline exceeded');\n\n\tvi.useFakeTimers();\n\tvi.setSystemTime(1_000);\n\t// At the exact deadline the request is already too late (>=, not >).\n\texpect(() => assertBeforeDeadline(1_000)).toThrow(DeadlineExceededError);\n});\n\ntest('backs off exponentially when a retryable response has no Retry-After header', async () => {\n\tvi.useFakeTimers();\n\tconst setTimeoutSpy = vi.spyOn(globalThis, 'setTimeout');\n\tvi.stubGlobal('fetch', vi.fn()\n\t\t.mockResolvedValueOnce(new Response('', { status: 429 }))\n\t\t.mockResolvedValueOnce(new Response('', { status: 429 }))\n\t\t.mockResolvedValue(new Response('', { status: 200 })));\n\n\tconst promise = fetchWithRetry('https://example.test');\n\tawait vi.advanceTimersByTimeAsync(1_000);\n\tawait vi.advanceTimersByTimeAsync(2_000);\n\texpect((await promise).status).toBe(200);\n\n\t// 1s then 2s: a missing header must fall back to exponential backoff\n\t// (doubling per attempt), not to zero delay or a flat 1s.\n\texpect(setTimeoutSpy.mock.calls.map((call) => call[1])).toEqual([1_000, 2_000]);\n});\n\ntest('honours Retry-After as an HTTP date and ignores an unparseable value', async () => {\n\tvi.useFakeTimers();\n\tvi.setSystemTime(1_000_000);\n\tconst setTimeoutSpy = vi.spyOn(globalThis, 'setTimeout');\n\tvi.stubGlobal('fetch', vi.fn()\n\t\t.mockResolvedValueOnce(new Response('', {\n\t\t\tstatus: 429,\n\t\t\theaders: { 'Retry-After': new Date(1_000_000 + 2_000).toUTCString() }\n\t\t}))\n\t\t.mockResolvedValueOnce(new Response('', {\n\t\t\tstatus: 429,\n\t\t\theaders: { 'Retry-After': 'not-a-date' }\n\t\t}))\n\t\t.mockResolvedValue(new Response('', { status: 200 })));\n\n\tconst promise = fetchWithRetry('https://example.test');\n\tawait vi.advanceTimersByTimeAsync(2_000);\n\tawait vi.advanceTimersByTimeAsync(2_000);\n\texpect((await promise).status).toBe(200);\n\n\t// A valid HTTP date waits until that date; a value that is neither a\n\t// number nor a parseable date must fall back to exponential backoff\n\t// (2s for the second attempt), never to a NaN/0 delay.\n\texpect(setTimeoutSpy.mock.calls.map((call) => call[1])).toEqual([2_000, 2_000]);\n});\n\ntest('fails immediately without a retry sleep when an error surfaces at the deadline', async () => {\n\tvi.useFakeTimers();\n\tvi.setSystemTime(1_000);\n\tconst setTimeoutSpy = vi.spyOn(globalThis, 'setTimeout');\n\tconst fetch = vi.fn().mockRejectedValue(new TypeError('fetch failed'));\n\tvi.stubGlobal('fetch', fetch);\n\n\tlet caught: unknown;\n\tconst promise = fetchWithRetry('https://example.test', {}, 1_000).catch((error: unknown) => {\n\t\tcaught = error;\n\t});\n\t// advanceTimersByTimeAsync(0) drains any zero-delay retry sleeps: if the\n\t// error were (wrongly) retried instead of failing fast, the loop would\n\t// burn through its remaining attempts here and `caught` would still be\n\t// set — but only after scheduling sleeps, which the spy must never see.\n\tawait vi.advanceTimersByTimeAsync(0);\n\tawait promise;\n\n\texpect(caught).toBeInstanceOf(DeadlineExceededError);\n\texpect((caught as Error).message).toBe('request deadline exceeded');\n\texpect(setTimeoutSpy).not.toHaveBeenCalled();\n\texpect(fetch).not.toHaveBeenCalled();\n});\n"},"src/routes/(app)/dashboard/actions.test.ts":{"tests":[{"id":"36","name":"persists sensitivity level '1'"},{"id":"37","name":"persists sensitivity level '2'"},{"id":"38","name":"rejects invalid sensitivity level \"'0'\" with 400 and changes nothing"},{"id":"39","name":"rejects invalid sensitivity level \"'3'\" with 400 and changes nothing"},{"id":"40","name":"rejects invalid sensitivity level \"'x'\" with 400 and changes nothing"},{"id":"41","name":"rejects invalid sensitivity level \"''\" with 400 and changes nothing"},{"id":"42","name":"rejects an unknown channel with 404"},{"id":"43","name":"rejects a channel owned by another team with 404 and changes nothing"},{"id":"44","name":"rejects a signed-out request with 401"},{"id":"45","name":"analyze history moves the scan boundary N months back and resets the drain state"},{"id":"46","name":"analyze history rejects months \"'0'\" with 400 and changes nothing"},{"id":"47","name":"analyze history rejects months \"'2'\" with 400 and changes nothing"},{"id":"48","name":"analyze history rejects months \"'25'\" with 400 and changes nothing"},{"id":"49","name":"analyze history rejects months \"'x'\" with 400 and changes nothing"},{"id":"50","name":"analyze history rejects months \"''\" with 400 and changes nothing"},{"id":"51","name":"analyze history rejects an unknown channel with 404"},{"id":"52","name":"analyze history rejects a channel owned by another team with 404 and changes nothing"},{"id":"53","name":"analyze history rejects a signed-out request with 401"},{"id":"54","name":"analyze history returns 409 while the channel is leased to a cron run and changes nothing"},{"id":"55","name":"analyze history proceeds once the lease has expired"},{"id":"56","name":"set protections persists both flags on"},{"id":"57","name":"set protections persists 0 for an unticked checkbox, clearing a previous 1"},{"id":"58","name":"set protections persists 0 for an unticked women checkbox"},{"id":"59","name":"set protections rejects an unknown channel with 404"},{"id":"60","name":"set protections rejects a channel owned by another team with 404 and changes nothing"},{"id":"61","name":"set protections rejects a signed-out request with 401"},{"id":"62","name":"dry run previews a live deployment through runChannel and echoes the counts"},{"id":"63","name":"dry run rejects a signed-out request with 401 and never runs"},{"id":"64","name":"dry run rejects a channel owned by another team with 404 and never runs"},{"id":"65","name":"dry run refuses to race a cron run holding the channel lease (409)"},{"id":"66","name":"a failed dry run is loud on the server and a generic 502 to the client"},{"id":"67","name":"'set tone level' treats an absent channelId field as empty — never matching any channel"},{"id":"68","name":"'set protections' treats an absent channelId field as empty — never matching any channel"},{"id":"69","name":"'analyze history' treats an absent channelId field as empty — never matching any channel"},{"id":"70","name":"'dry run' treats an absent channelId field as empty — never matching any channel"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { beforeEach, expect, test, vi } from 'vitest';\nimport { TEST_OWNER, postForm, setupTestDb, testDb } from '$lib/server/testdb';\nimport { channels } from '$lib/server/db/schema';\nimport { eq } from 'drizzle-orm';\n\nconst mocks = vi.hoisted(() => ({ runChannel: vi.fn() }));\nvi.mock('$lib/server/pipeline', () => ({ runChannel: mocks.runChannel }));\n\nimport { actions } from './+page.server';\n\nsetupTestDb(['channels']);\n\nconst OWNER = TEST_OWNER;\n\nbeforeEach(() => {\n\tmocks.runChannel.mockReset();\n});\n\nasync function seedChannel(id: string, userId: string | null = OWNER.id, orgId: string | null = 'org-1') {\n\tawait testDb().db.insert(channels).values({ id, userId, orgId, title: `Channel ${id}`, refreshTokenEnc: 'enc' });\n}\n\nfunction setToneLevel(channelId: string, toneLevel: string, user: typeof OWNER | null = OWNER) {\n\treturn actions.setToneLevel({ request: postForm({ channelId, toneLevel }), locals: { user } } as never);\n}\n\nasync function toneLevelOf(id: string) {\n\tconst row = await testDb().db.select().from(channels).where(eq(channels.id, id)).get();\n\treturn row?.toneLevel;\n}\n\ntest.each([{ level: '1' }, { level: '2' }])('persists sensitivity level $level', async ({ level }) => {\n\tawait seedChannel('UC1');\n\n\tconst res = await setToneLevel('UC1', level);\n\n\texpect(res).toMatchObject({ ok: true });\n\texpect(await toneLevelOf('UC1')).toBe(Number(level));\n});\n\ntest.each([{ level: '0' }, { level: '3' }, { level: 'x' }, { level: '' }])(\n\t'rejects invalid sensitivity level \"$level\" with 400 and changes nothing',\n\tasync ({ level }) => {\n\t\tawait seedChannel('UC1');\n\n\t\tconst res = await setToneLevel('UC1', level);\n\n\t\texpect(res).toMatchObject({\n\t\t\tstatus: 400,\n\t\t\tdata: { error: 'tone level must be 1 (Edge Lord) or 2 (Edge lord + Ackchyually…)' }\n\t\t});\n\t\texpect(await toneLevelOf('UC1')).toBeNull();\n\t}\n);\n\ntest('rejects an unknown channel with 404', async () => {\n\tconst res = await setToneLevel('UC-missing', '2');\n\n\texpect(res).toMatchObject({ status: 404, data: { error: 'channel not found' } });\n});\n\ntest('rejects a channel owned by another team with 404 and changes nothing', async () => {\n\tawait seedChannel('UC1', 'user-2', 'org-2');\n\n\tconst res = await setToneLevel('UC1', '2');\n\n\texpect(res).toMatchObject({ status: 404 });\n\texpect(await toneLevelOf('UC1')).toBeNull();\n});\n\ntest('rejects a signed-out request with 401', async () => {\n\tawait seedChannel('UC1');\n\n\tawait expect(setToneLevel('UC1', '2', null)).rejects.toMatchObject({ status: 401 });\n\texpect(await toneLevelOf('UC1')).toBeNull();\n});\n\nfunction analyzeHistory(channelId: string, months: string, user: typeof OWNER | null = OWNER) {\n\treturn actions.analyzeHistory({ request: postForm({ channelId, months }), locals: { user } } as never);\n}\n\nasync function scanWindowOf(id: string) {\n\tconst row = await testDb().db.select().from(channels).where(eq(channels.id, id)).get();\n\treturn { cursor: row?.cursor, nextPageToken: row?.nextPageToken, scanCursor: row?.scanCursor };\n}\n\ntest('analyze history moves the scan boundary N months back and resets the drain state', async () => {\n\tawait seedChannel('UC1');\n\tawait testDb()\n\t\t.db.update(channels)\n\t\t.set({ cursor: '2026-07-30T00:00:00.000Z', nextPageToken: 'tok', scanCursor: '2026-07-29T00:00:00.000Z' })\n\t\t.where(eq(channels.id, 'UC1'));\n\n\t// The request is logged loudly with channel and boundary.\n\tconst infoSpy = vi.spyOn(console, 'info').mockImplementation(() => {});\n\ttry {\n\t\tconst before = Date.now();\n\t\tconst res = await analyzeHistory('UC1', '3');\n\t\tconst after = Date.now();\n\n\t\texpect(res).toMatchObject({ ok: true, scope: 'history', channelId: 'UC1', months: 3 });\n\t\texpect(infoSpy).toHaveBeenCalledWith(\n\t\t\texpect.stringMatching(/^history analysis requested for channel UC1: scanning back to /)\n\t\t);\n\t\tconst { cursor, nextPageToken, scanCursor } = await scanWindowOf('UC1');\n\t\texpect(nextPageToken).toBeNull();\n\t\texpect(scanCursor).toBeNull();\n\t\t// 3 months ≈ 90 days back, computed at action time.\n\t\tconst expected = 3 * 30 * 24 * 60 * 60 * 1000;\n\t\texpect(Date.parse(cursor ?? '')).toBeGreaterThanOrEqual(before - expected - 1000);\n\t\texpect(Date.parse(cursor ?? '')).toBeLessThanOrEqual(after - expected + 1000);\n\t} finally {\n\t\tinfoSpy.mockRestore();\n\t}\n});\n\ntest.each([{ months: '0' }, { months: '2' }, { months: '25' }, { months: 'x' }, { months: '' }])(\n\t'analyze history rejects months \"$months\" with 400 and changes nothing',\n\tasync ({ months }) => {\n\t\tawait seedChannel('UC1');\n\t\tawait testDb()\n\t\t\t.db.update(channels)\n\t\t\t.set({ cursor: '2026-07-30T00:00:00.000Z', nextPageToken: 'tok', scanCursor: '2026-07-29T00:00:00.000Z' })\n\t\t\t.where(eq(channels.id, 'UC1'));\n\n\t\tconst res = await analyzeHistory('UC1', months);\n\n\t\texpect(res).toMatchObject({\n\t\t\tstatus: 400,\n\t\t\tdata: {\n\t\t\t\tscope: 'history',\n\t\t\t\tchannelId: 'UC1',\n\t\t\t\terror: 'history window must be 1, 3, 6, 12, or 24 months'\n\t\t\t}\n\t\t});\n\t\texpect(await scanWindowOf('UC1')).toEqual({\n\t\t\tcursor: '2026-07-30T00:00:00.000Z',\n\t\t\tnextPageToken: 'tok',\n\t\t\tscanCursor: '2026-07-29T00:00:00.000Z'\n\t\t});\n\t}\n);\n\ntest('analyze history rejects an unknown channel with 404', async () => {\n\tconst res = await analyzeHistory('UC-missing', '3');\n\n\texpect(res).toMatchObject({\n\t\tstatus: 404,\n\t\tdata: { scope: 'history', channelId: 'UC-missing', error: 'channel not found' }\n\t});\n});\n\ntest('analyze history rejects a channel owned by another team with 404 and changes nothing', async () => {\n\tawait seedChannel('UC1', 'user-2', 'org-2');\n\tawait testDb()\n\t\t.db.update(channels)\n\t\t.set({ cursor: '2026-07-30T00:00:00.000Z', nextPageToken: 'tok', scanCursor: '2026-07-29T00:00:00.000Z' })\n\t\t.where(eq(channels.id, 'UC1'));\n\n\tconst res = await analyzeHistory('UC1', '3');\n\n\texpect(res).toMatchObject({ status: 404 });\n\texpect(await scanWindowOf('UC1')).toEqual({\n\t\tcursor: '2026-07-30T00:00:00.000Z',\n\t\tnextPageToken: 'tok',\n\t\tscanCursor: '2026-07-29T00:00:00.000Z'\n\t});\n});\n\ntest('analyze history rejects a signed-out request with 401', async () => {\n\tawait seedChannel('UC1');\n\n\tawait expect(analyzeHistory('UC1', '3', null)).rejects.toMatchObject({ status: 401 });\n});\n\ntest('analyze history returns 409 while the channel is leased to a cron run and changes nothing', async () => {\n\tawait seedChannel('UC1');\n\tawait testDb()\n\t\t.db.update(channels)\n\t\t.set({\n\t\t\tcursor: '2026-07-30T00:00:00.000Z',\n\t\t\tnextPageToken: 'tok',\n\t\t\tscanCursor: '2026-07-29T00:00:00.000Z',\n\t\t\tleaseExpiresAt: new Date(Date.now() + 60_000).toISOString()\n\t\t})\n\t\t.where(eq(channels.id, 'UC1'));\n\n\tconst res = await analyzeHistory('UC1', '3');\n\n\texpect(res).toMatchObject({\n\t\tstatus: 409,\n\t\tdata: { scope: 'history', channelId: 'UC1', error: 'This channel is mid-scan — retry in a minute.' }\n\t});\n\t// The in-flight run keeps its scan state — the user's boundary is not\n\t// half-applied underneath it.\n\texpect(await scanWindowOf('UC1')).toEqual({\n\t\tcursor: '2026-07-30T00:00:00.000Z',\n\t\tnextPageToken: 'tok',\n\t\tscanCursor: '2026-07-29T00:00:00.000Z'\n\t});\n});\n\ntest('analyze history proceeds once the lease has expired', async () => {\n\tawait seedChannel('UC1');\n\tawait testDb()\n\t\t.db.update(channels)\n\t\t.set({ leaseExpiresAt: '2020-01-01T00:00:00.000Z' })\n\t\t.where(eq(channels.id, 'UC1'));\n\n\tconst res = await analyzeHistory('UC1', '3');\n\n\texpect(res).toMatchObject({ ok: true });\n});\n\nfunction setProtections(\n\tchannelId: string,\n\tfields: { protectLgbtqia?: 'on'; protectWomen?: 'on' },\n\tuser: typeof OWNER | null = OWNER\n) {\n\treturn actions.setProtections({ request: postForm({ channelId, ...fields }), locals: { user } } as never);\n}\n\nasync function protectionsOf(id: string) {\n\tconst row = await testDb().db.select().from(channels).where(eq(channels.id, id)).get();\n\treturn { protectLgbtqia: row?.protectLgbtqia, protectWomen: row?.protectWomen };\n}\n\ntest('set protections persists both flags on', async () => {\n\tawait seedChannel('UC1');\n\n\tconst res = await setProtections('UC1', { protectLgbtqia: 'on', protectWomen: 'on' });\n\n\texpect(res).toMatchObject({ ok: true });\n\texpect(await protectionsOf('UC1')).toEqual({ protectLgbtqia: 1, protectWomen: 1 });\n});\n\ntest('set protections persists 0 for an unticked checkbox, clearing a previous 1', async () => {\n\tawait seedChannel('UC1');\n\tawait testDb().db.update(channels).set({ protectLgbtqia: 1, protectWomen: 1 }).where(eq(channels.id, 'UC1'));\n\n\t// Only women stays ticked; the absent LGBTQIA+ field must persist 0.\n\tconst res = await setProtections('UC1', { protectWomen: 'on' });\n\n\texpect(res).toMatchObject({ ok: true });\n\texpect(await protectionsOf('UC1')).toEqual({ protectLgbtqia: 0, protectWomen: 1 });\n});\n\ntest('set protections persists 0 for an unticked women checkbox', async () => {\n\tawait seedChannel('UC1');\n\tawait testDb().db.update(channels).set({ protectLgbtqia: 1, protectWomen: 1 }).where(eq(channels.id, 'UC1'));\n\n\t// Only LGBTQIA+ stays ticked; the absent women field must persist 0.\n\tconst res = await setProtections('UC1', { protectLgbtqia: 'on' });\n\n\texpect(res).toMatchObject({ ok: true });\n\texpect(await protectionsOf('UC1')).toEqual({ protectLgbtqia: 1, protectWomen: 0 });\n});\n\ntest('set protections rejects an unknown channel with 404', async () => {\n\tconst res = await setProtections('UC-missing', { protectLgbtqia: 'on' });\n\n\texpect(res).toMatchObject({\n\t\tstatus: 404,\n\t\tdata: { scope: 'protections', channelId: 'UC-missing', error: 'channel not found' }\n\t});\n});\n\ntest('set protections rejects a channel owned by another team with 404 and changes nothing', async () => {\n\tawait seedChannel('UC1', 'user-2', 'org-2');\n\n\tconst res = await setProtections('UC1', { protectLgbtqia: 'on', protectWomen: 'on' });\n\n\texpect(res).toMatchObject({ status: 404 });\n\texpect(await protectionsOf('UC1')).toEqual({ protectLgbtqia: 0, protectWomen: 0 });\n});\n\ntest('set protections rejects a signed-out request with 401', async () => {\n\tawait seedChannel('UC1');\n\n\tawait expect(setProtections('UC1', { protectLgbtqia: 'on' }, null)).rejects.toMatchObject({ status: 401 });\n\texpect(await protectionsOf('UC1')).toEqual({ protectLgbtqia: 0, protectWomen: 0 });\n});\n\nfunction dryRun(channelId: string, user: typeof OWNER | null = OWNER) {\n\treturn actions.dryRun({ request: postForm({ channelId }), locals: { user } } as never);\n}\n\ntest('dry run previews a live deployment through runChannel and echoes the counts', async () => {\n\tawait seedChannel('UC1');\n\tlet leaseDuringRun: string | null | undefined;\n\tmocks.runChannel.mockImplementation(async () => {\n\t\t// While the preview runs, the channel must be leased ~60s out so cron\n\t\t// cannot claim it underneath the run.\n\t\tconst ch = await testDb().db.select().from(channels).where(eq(channels.id, 'UC1')).get();\n\t\tleaseDuringRun = ch?.leaseExpiresAt;\n\t\treturn { fetched: 3, acted: 1, queued: 1, partial: false, skipped: false, dryRun: true };\n\t});\n\n\tconst before = Date.now();\n\tconst res = await dryRun('UC1');\n\tconst after = Date.now();\n\n\texpect(mocks.runChannel).toHaveBeenCalledWith('UC1', {\n\t\tmaxPages: 1,\n\t\tdeadline: expect.any(Number),\n\t\tforceDryRun: true\n\t});\n\t// One page with a hard 20s ceiling so the preview fits the serverless window.\n\tconst deadline = mocks.runChannel.mock.calls[0][1].deadline as number;\n\texpect(deadline).toBeGreaterThan(before);\n\texpect(deadline).toBeLessThanOrEqual(after + 20_000);\n\texpect(deadline).toBeGreaterThanOrEqual(before + 19_000);\n\t// The claim lease extends ~60s into the future and self-expires if the\n\t// request dies mid-preview.\n\texpect(Date.parse(leaseDuringRun ?? '')).toBeGreaterThanOrEqual(before + 59_000);\n\texpect(Date.parse(leaseDuringRun ?? '')).toBeLessThanOrEqual(after + 60_000);\n\texpect(res).toMatchObject({ ok: true, scope: 'dryRun', channelId: 'UC1', fetched: 3, acted: 1, queued: 1, dryRun: true });\n\t// The preview takes the cron lease atomically and releases it afterwards;\n\t// a preview is not a run, so lastRunAt is never touched.\n\tconst ch = await testDb().db.select().from(channels).where(eq(channels.id, 'UC1')).get();\n\texpect(ch?.leaseExpiresAt).toBeNull();\n\texpect(ch?.lastRunAt).toBeNull();\n});\n\ntest('dry run rejects a signed-out request with 401 and never runs', async () => {\n\tawait seedChannel('UC1');\n\n\tawait expect(dryRun('UC1', null)).rejects.toMatchObject({ status: 401 });\n\texpect(mocks.runChannel).not.toHaveBeenCalled();\n});\n\ntest('dry run rejects a channel owned by another team with 404 and never runs', async () => {\n\tawait seedChannel('UC1', 'user-2', 'org-2');\n\n\tconst res = await dryRun('UC1');\n\n\texpect(res).toMatchObject({\n\t\tstatus: 404,\n\t\tdata: { scope: 'dryRun', channelId: 'UC1', error: 'channel not found' }\n\t});\n\texpect(mocks.runChannel).not.toHaveBeenCalled();\n});\n\ntest('dry run refuses to race a cron run holding the channel lease (409)', async () => {\n\tawait seedChannel('UC1');\n\tawait testDb().db.update(channels).set({ leaseExpiresAt: '2099-01-01T00:00:00.000Z' }).where(eq(channels.id, 'UC1'));\n\n\tconst res = await dryRun('UC1');\n\n\texpect(res).toMatchObject({\n\t\tstatus: 409,\n\t\tdata: { scope: 'dryRun', channelId: 'UC1', error: 'This channel is mid-scan — retry in a minute.' }\n\t});\n\texpect(mocks.runChannel).not.toHaveBeenCalled();\n});\n\ntest('a failed dry run is loud on the server and a generic 502 to the client', async () => {\n\tawait seedChannel('UC1');\n\tmocks.runChannel.mockRejectedValue(new Error('raw upstream detail: invalid_grant abc123'));\n\tconst spy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\ttry {\n\t\tconst res = (await dryRun('UC1')) as { status: number; data: { error: string } };\n\n\t\texpect(res.status).toBe(502);\n\t\texpect(res.data).toEqual({\n\t\t\tscope: 'dryRun',\n\t\t\tchannelId: 'UC1',\n\t\t\terror: 'The dry run failed — check the server log and try again.'\n\t\t});\n\t\texpect(res.data.error).not.toContain('invalid_grant');\n\t\texpect(spy).toHaveBeenCalledWith('dry run failed for channel:', 'UC1', expect.any(Error));\n\t\t// The lease is released even on failure so cron is never blocked.\n\t\tconst ch = await testDb().db.select().from(channels).where(eq(channels.id, 'UC1')).get();\n\t\texpect(ch?.leaseExpiresAt).toBeNull();\n\t} finally {\n\t\tspy.mockRestore();\n\t}\n});\n\ntest.each([\n\t{\n\t\tname: 'set tone level',\n\t\tcall: () => actions.setToneLevel({ request: postForm({ toneLevel: '2' }), locals: { user: OWNER } } as never),\n\t\techoes: false\n\t},\n\t{\n\t\tname: 'set protections',\n\t\tcall: () => actions.setProtections({ request: postForm({ protectLgbtqia: 'on' }), locals: { user: OWNER } } as never),\n\t\techoes: true\n\t},\n\t{\n\t\tname: 'analyze history',\n\t\tcall: () => actions.analyzeHistory({ request: postForm({ months: '3' }), locals: { user: OWNER } } as never),\n\t\techoes: true\n\t},\n\t{\n\t\tname: 'dry run',\n\t\tcall: () => actions.dryRun({ request: postForm({}), locals: { user: OWNER } } as never),\n\t\techoes: true\n\t}\n])('$name treats an absent channelId field as empty — never matching any channel', async ({ call, echoes }) => {\n\t// A channel whose id is exactly what a `?? ''` mutant would substitute:\n\t// with the field absent, the lookup must still hit nothing.\n\tawait seedChannel('Stryker was here!');\n\n\tconst res = (await call()) as { status: number; data: Record<"+"string, unknown> };\n\n\texpect(res.status).toBe(404);\n\tif (echoes) expect(res.data.channelId).toBe('');\n\t// The decoy channel is untouched and nothing ran.\n\texpect(await toneLevelOf('Stryker was here!')).toBeNull();\n\texpect(await scanWindowOf('Stryker was here!')).toEqual({ cursor: null, nextPageToken: null, scanCursor: null });\n\texpect(await protectionsOf('Stryker was here!')).toEqual({ protectLgbtqia: 0, protectWomen: 0 });\n\texpect(mocks.runChannel).not.toHaveBeenCalled();\n});\n"},"src/routes/(app)/channels/[id]/queue/actions.test.ts":{"tests":[{"id":"71","name":"load projects only the channel fields the page renders — never the credential"},{"id":"72","name":"every action rejects a signed-out request with 401 before validating the form"},{"id":"73","name":"every action rejects a missing commentId with 400 and mutates nothing"},{"id":"74","name":"a whitespace-padded commentId is trimmed before lookup"},{"id":"75","name":"act fails loudly on another channel comment and changes nothing"},{"id":"76","name":"a 404 on an unknown pending comment names the problem"},{"id":"77","name":"act fails loudly on a comment that is no longer pending"},{"id":"78","name":"a second act on an already-claimed comment 404s and audits nothing new"},{"id":"79","name":"a failed YouTube call releases the claim so the action stays retryable"},{"id":"80","name":"approve in DRY_RUN finalizes locally, audits dry-run, and skips YouTube"},{"id":"81","name":"reject outside DRY_RUN calls YouTube and audits reject"},{"id":"82","name":"approve outside DRY_RUN skips YouTube entirely and audits approve"},{"id":"83","name":"del outside DRY_RUN deletes on YouTube, marks deleted, and audits delete"},{"id":"84","name":"ban outside DRY_RUN rejects with the author ban on YouTube and audits ban"},{"id":"85","name":"load returns only this channel’s pending comments"},{"id":"86","name":"act fails loudly on a channel owned by another team and changes nothing"},{"id":"87","name":"act rejects a signed-out request with 401"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { beforeEach, expect, test, vi } from 'vitest';\nimport { TEST_OWNER, postForm, setupTestDb, testDb } from '$lib/server/testdb';\nimport { auditLog, channels, comments } from '$lib/server/db/schema';\nimport { eq } from 'drizzle-orm';\n\nconst mocks = vi.hoisted(() => ({\n\tenv: { DRY_RUN: 'true' } as Record<"+"string, string | undefined>,\n\trefreshAccessToken: vi.fn(async () => 'access-token'),\n\tsetModerationStatus: vi.fn(async () => {}),\n\tdeleteComment: vi.fn(async () => {})\n}));\n\nvi.mock('$env/dynamic/private', () => ({ env: mocks.env }));\nvi.mock('$lib/server/crypto', () => ({ decrypt: vi.fn(() => 'decrypted-refresh-token') }));\nvi.mock('$lib/server/youtube', () => ({\n\trefreshAccessToken: mocks.refreshAccessToken,\n\tsetModerationStatus: mocks.setModerationStatus,\n\tdeleteComment: mocks.deleteComment\n}));\n\nimport { actions, load } from './+page.server';\n\nsetupTestDb(['audit_log', 'comments', 'channels']);\n\nbeforeEach(async () => {\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values([\n\t\t\t{ id: 'UC1', userId: OWNER.id, orgId: 'org-1', title: 'One', refreshTokenEnc: 'enc-1' },\n\t\t\t{ id: 'UC2', userId: OWNER.id, orgId: 'org-1', title: 'Two', refreshTokenEnc: 'enc-2' }\n\t\t]);\n\tmocks.env.DRY_RUN = 'true';\n\tvi.clearAllMocks();\n});\n\nconst QUEUE_URL = 'http://localhost/channels/UC1/queue';\n\nconst OWNER = TEST_OWNER;\n\nconst actionNames = ['approve', 'reject', 'del', 'ban'] as const;\n\nfunction act(name: (typeof actionNames)[number], fields: Record<"+"string, string>, channelId = 'UC1', user: typeof OWNER | null = OWNER) {\n\treturn actions[name]({ params: { id: channelId }, request: postForm(fields, QUEUE_URL), locals: { user } } as never);\n}\n\nasync function expectAllActions404(fields: Record<"+"string, string>) {\n\tfor (const name of actionNames) {\n\t\tawait expect(act(name, fields)).rejects.toThrowError(expect.objectContaining({ status: 404 }));\n\t}\n}\n\nasync function seedComment(id: string, channelId: string, status = 'pending') {\n\tawait testDb().db.insert(comments).values({\n\t\tid,\n\t\tchannelId,\n\t\ttext: 'hello',\n\t\tpublishedAt: '2026-01-01T00:00:00Z',\n\t\tstatus,\n\t\tdecidedBy: 'ai'\n\t});\n}\n\nasync function commentRow(id: string) {\n\treturn testDb().db.select().from(comments).where(eq(comments.id, id)).get();\n}\n\nasync function auditRows() {\n\treturn testDb().db.select().from(auditLog).all();\n}\n\nasync function expectNothingDecided(id: string, status: string) {\n\texpect((await commentRow(id))?.status).toBe(status);\n\texpect(await auditRows()).toHaveLength(0);\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n\texpect(mocks.deleteComment).not.toHaveBeenCalled();\n}\n\ntest('load projects only the channel fields the page renders — never the credential', async () => {\n\tconst result = await load({ params: { id: 'UC1' }, locals: { user: OWNER } } as never);\n\texpect(result?.ch).toEqual({ id: 'UC1', title: 'One' });\n\texpect(result?.ch).not.toHaveProperty('refreshTokenEnc');\n});\n\ntest('every action rejects a signed-out request with 401 before validating the form', async () => {\n\tfor (const name of actionNames) {\n\t\tawait expect(act(name, {}, 'UC1', null)).rejects.toThrowError(expect.objectContaining({ status: 401 }));\n\t}\n});\n\ntest('every action rejects a missing commentId with 400 and mutates nothing', async () => {\n\tawait seedComment('c1', 'UC1');\n\tfor (const name of actionNames) {\n\t\tconst res = await act(name, {});\n\t\texpect(res).toMatchObject({ status: 400, data: { error: 'Invalid comment ID' } });\n\t}\n\tawait expectNothingDecided('c1', 'pending');\n});\n\ntest('a whitespace-padded commentId is trimmed before lookup', async () => {\n\tawait seedComment('c1', 'UC1');\n\tconst res = await act('approve', { commentId: '  c1\\t' });\n\texpect(res).toMatchObject({ success: 'Approved — recorded in audit log.' });\n\texpect((await commentRow('c1'))?.status).toBe('approved');\n});\n\ntest('act fails loudly on another channel comment and changes nothing', async () => {\n\tawait seedComment('c2', 'UC2');\n\tawait expectAllActions404({ commentId: 'c2' });\n\tawait expectNothingDecided('c2', 'pending');\n});\n\ntest('a 404 on an unknown pending comment names the problem', async () => {\n\tawait expect(act('approve', { commentId: 'nope' })).rejects.toThrowError(\n\t\texpect.objectContaining({ status: 404, body: { message: 'pending comment not found in this channel' } })\n\t);\n});\n\ntest('act fails loudly on a comment that is no longer pending', async () => {\n\tawait seedComment('c3', 'UC1', 'approved');\n\tawait expectAllActions404({ commentId: 'c3' });\n\texpect((await commentRow('c3'))?.decidedBy).toBe('ai');\n\tawait expectNothingDecided('c3', 'approved');\n});\n\ntest('a second act on an already-claimed comment 404s and audits nothing new', async () => {\n\tawait seedComment('c1', 'UC1');\n\tawait act('approve', { commentId: 'c1' });\n\n\tawait expect(act('reject', { commentId: 'c1' })).rejects.toThrowError(expect.objectContaining({ status: 404 }));\n\n\texpect((await commentRow('c1'))?.status).toBe('approved');\n\texpect(await auditRows()).toHaveLength(1);\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n});\n\ntest('a failed YouTube call releases the claim so the action stays retryable', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tmocks.setModerationStatus.mockRejectedValueOnce(new Error('youtube 500'));\n\tawait seedComment('c1', 'UC1');\n\n\tawait expect(act('reject', { commentId: 'c1' })).rejects.toThrowError('youtube 500');\n\n\texpect(await commentRow('c1')).toMatchObject({ status: 'pending', decidedBy: 'none' });\n\texpect(await auditRows()).toHaveLength(0);\n\n\t// The retry goes through.\n\tconst res = await act('reject', { commentId: 'c1' });\n\texpect(res).toMatchObject({ success: 'Rejected — recorded in audit log.' });\n\texpect((await commentRow('c1'))?.status).toBe('rejected');\n});\n\ntest('approve in DRY_RUN finalizes locally, audits dry-run, and skips YouTube', async () => {\n\tawait seedComment('c1', 'UC1');\n\tconst res = await act('approve', { commentId: 'c1' });\n\texpect(res).toMatchObject({ success: 'Approved — recorded in audit log.' });\n\n\tconst row = await commentRow('c1');\n\texpect(row?.status).toBe('approved');\n\texpect(row?.decidedBy).toBe('human');\n\n\tconst audits = await auditRows();\n\texpect(audits).toHaveLength(1);\n\texpect(audits[0]).toMatchObject({ channelId: 'UC1', commentId: 'c1', action: 'dry-run', actor: 'user' });\n\n\texpect(mocks.refreshAccessToken).not.toHaveBeenCalled();\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n\texpect(mocks.deleteComment).not.toHaveBeenCalled();\n});\n\ntest('reject outside DRY_RUN calls YouTube and audits reject', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tawait seedComment('c1', 'UC1');\n\tconst res = await act('reject', { commentId: 'c1' });\n\texpect(res).toMatchObject({ success: 'Rejected — recorded in audit log.' });\n\n\texpect(mocks.refreshAccessToken).toHaveBeenCalledWith('decrypted-refresh-token');\n\texpect(mocks.setModerationStatus).toHaveBeenCalledTimes(1);\n\texpect(mocks.setModerationStatus).toHaveBeenCalledWith(['c1'], 'rejected', false, 'access-token');\n\texpect(mocks.deleteComment).not.toHaveBeenCalled();\n\texpect((await commentRow('c1'))?.status).toBe('rejected');\n\n\tconst audits = await auditRows();\n\texpect(audits).toHaveLength(1);\n\texpect(audits[0]).toMatchObject({ channelId: 'UC1', commentId: 'c1', action: 'reject', reason: 'manual review', actor: 'user' });\n});\n\ntest('approve outside DRY_RUN skips YouTube entirely and audits approve', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tawait seedComment('c1', 'UC1');\n\tconst res = await act('approve', { commentId: 'c1' });\n\texpect(res).toMatchObject({ success: 'Approved — recorded in audit log.' });\n\n\texpect(mocks.refreshAccessToken).not.toHaveBeenCalled();\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n\texpect(mocks.deleteComment).not.toHaveBeenCalled();\n\texpect((await commentRow('c1'))?.status).toBe('approved');\n\n\tconst audits = await auditRows();\n\texpect(audits).toHaveLength(1);\n\texpect(audits[0]).toMatchObject({ channelId: 'UC1', commentId: 'c1', action: 'approve', reason: 'manual review', actor: 'user' });\n});\n\ntest('del outside DRY_RUN deletes on YouTube, marks deleted, and audits delete', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tawait seedComment('c1', 'UC1');\n\tconst res = await act('del', { commentId: 'c1' });\n\texpect(res).toMatchObject({ success: 'Deleted — recorded in audit log.' });\n\n\texpect(mocks.refreshAccessToken).toHaveBeenCalledWith('decrypted-refresh-token');\n\texpect(mocks.deleteComment).toHaveBeenCalledTimes(1);\n\texpect(mocks.deleteComment).toHaveBeenCalledWith('c1', 'access-token');\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n\texpect((await commentRow('c1'))?.status).toBe('deleted');\n\n\tconst audits = await auditRows();\n\texpect(audits).toHaveLength(1);\n\texpect(audits[0]).toMatchObject({ channelId: 'UC1', commentId: 'c1', action: 'delete', reason: 'manual review', actor: 'user' });\n});\n\ntest('ban outside DRY_RUN rejects with the author ban on YouTube and audits ban', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tawait seedComment('c1', 'UC1');\n\tconst res = await act('ban', { commentId: 'c1' });\n\texpect(res).toMatchObject({ success: 'Author banned — recorded in audit log.' });\n\n\texpect(mocks.refreshAccessToken).toHaveBeenCalledWith('decrypted-refresh-token');\n\texpect(mocks.setModerationStatus).toHaveBeenCalledTimes(1);\n\texpect(mocks.setModerationStatus).toHaveBeenCalledWith(['c1'], 'rejected', true, 'access-token');\n\texpect(mocks.deleteComment).not.toHaveBeenCalled();\n\texpect((await commentRow('c1'))?.status).toBe('rejected');\n\n\tconst audits = await auditRows();\n\texpect(audits).toHaveLength(1);\n\texpect(audits[0]).toMatchObject({ channelId: 'UC1', commentId: 'c1', action: 'ban', reason: 'manual review', actor: 'user' });\n});\n\ntest('load returns only this channel’s pending comments', async () => {\n\tawait seedComment('c-pending', 'UC1', 'pending');\n\tawait seedComment('c-approved', 'UC1', 'approved');\n\tawait seedComment('c-other', 'UC2', 'pending');\n\n\tconst result = await load({ params: { id: 'UC1' }, locals: { user: OWNER } } as never);\n\n\texpect(result?.pending.map((row) => row.id)).toEqual(['c-pending']);\n});\n\ntest('act fails loudly on a channel owned by another team and changes nothing', async () => {\n\t// The caller personally connected UC1 — under a different team. The org\n\t// gate must still 404 it (a per-user check would wrongly pass here).\n\tawait testDb().db.update(channels).set({ orgId: 'org-2' }).where(eq(channels.id, 'UC1'));\n\tawait seedComment('c9', 'UC1');\n\tfor (const name of actionNames) {\n\t\tawait expect(act(name, { commentId: 'c9' })).rejects.toThrowError(expect.objectContaining({ status: 404 }));\n\t}\n\tawait expectNothingDecided('c9', 'pending');\n});\n\ntest('act rejects a signed-out request with 401', async () => {\n\tawait seedComment('c8', 'UC1');\n\tfor (const name of actionNames) {\n\t\tawait expect(act(name, { commentId: 'c8' }, 'UC1', null)).rejects.toThrowError(expect.objectContaining({ status: 401 }));\n\t}\n\tawait expectNothingDecided('c8', 'pending');\n});\n"},"src/routes/(app)/dashboard/dashboard.test.ts":{"tests":[{"id":"88","name":"dashboard load never serializes the encrypted refresh token"},{"id":"89","name":"dashboard load shows only the active team's channels"},{"id":"90","name":"dashboard load returns empty stats and bans when the team has no channels"},{"id":"91","name":"dashboard load counts comments by status and ban events only, scoped to the team"},{"id":"92","name":"dashboard load rejects a signed-out request with 401"},{"id":"93","name":"dashboard load projects the protection flags for each channel"},{"id":"94","name":"delete account rejects a signed-out request with 401"},{"id":"95","name":"delete account without the confirmation checkbox writes nothing"},{"id":"96","name":"delete account rolls everything back when the erase transaction fails"},{"id":"97","name":"delete account revokes each channel at Google, erases everything, and signs out"},{"id":"98","name":"delete account still deletes when revocation fails, logging loudly"},{"id":"99","name":"a revocation failure on one channel does not stop the others"},{"id":"100","name":"a database outage returns the maintenance payload without requiring a user"},{"id":"101","name":"a database failure mid-load degrades to the maintenance payload and logs loudly"},{"id":"102","name":"a deliberate HttpError mid-load propagates instead of degrading to maintenance"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { expect, test, vi } from 'vitest';\nimport { error } from '@sveltejs/kit';\nimport { TEST_OWNER, postForm, setupTestDb, testDb } from '$lib/server/testdb';\nimport { makeCookies } from '$lib/server/testcookies';\nimport { auditLog, channels, comments, memberships, organizations, sessions, users } from '$lib/server/db/schema';\n\n// decrypt is mocked so seeds can use opaque placeholders; the action must pass\n// each channel's decrypted token to Google's revocation endpoint.\nconst decryptMock = vi.hoisted(() => vi.fn((_enc: string) => 'refresh-token'));\nvi.mock('$lib/server/crypto', () => ({ decrypt: decryptMock }));\n\nimport { actions, load } from './+page.server';\n\nsetupTestDb([\n\t'moderation_actions',\n\t'comments',\n\t'audit_log',\n\t'rules',\n\t'channels',\n\t'sessions',\n\t'users',\n\t'consents',\n\t'invites',\n\t'memberships',\n\t'organizations'\n]);\n\nconst OWNER = TEST_OWNER;\n\nfunction loadDashboard(user: typeof OWNER | null = OWNER) {\n\treturn load({ locals: { user } } as never);\n}\n\nasync function seedActiveUser() {\n\tawait testDb()\n\t\t.db.insert(users)\n\t\t.values({ id: OWNER.id, googleSub: 'sub-1', email: OWNER.email, displayName: OWNER.displayName });\n\t// Every real user's org-1 is their personal org (signup / 0012 backfill).\n\tawait testDb().db.insert(organizations).values({ id: 'org-1', name: 'One', personalFor: OWNER.id });\n\tawait testDb().db.insert(memberships).values({ userId: OWNER.id, orgId: 'org-1', role: 'owner' });\n\tawait testDb()\n\t\t.db.insert(sessions)\n\t\t.values({ id: 'sess-1', userId: OWNER.id, expiresAt: '2027-01-01T00:00:00.000Z' });\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC1', userId: OWNER.id, orgId: 'org-1', title: 'Mine', refreshTokenEnc: 'enc', active: 1 });\n}\n\n/** Token revocation succeeds. Returns the fetch spy for assertions. */\nfunction stubRevocation(ok = true) {\n\tconst fetch = vi.fn().mockResolvedValue(new Response('', { status: ok ? 200 : 500 }));\n\tvi.stubGlobal('fetch', fetch);\n\treturn fetch;\n}\n\nasync function captureDelete(user: typeof OWNER | null, fields: Record<"+"string, string>) {\n\tconst cookies = makeCookies();\n\ttry {\n\t\tconst res = await actions.deleteAccount({ request: postForm(fields), locals: { user }, cookies } as never);\n\t\treturn { res, cookies };\n\t} catch (e) {\n\t\treturn { res: e as { status: number; location?: string }, cookies };\n\t}\n}\n\n/** The seeded account is fully intact: not tombstoned, session alive, channel present. */\nasync function expectAccountUntouched() {\n\texpect((await testDb().db.select().from(users).all())[0]).toMatchObject({ googleSub: 'sub-1' });\n\texpect(await testDb().db.select().from(sessions).all()).toHaveLength(1);\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(1);\n}\n\ntest('dashboard load never serializes the encrypted refresh token', async () => {\n\tawait testDb().db.insert(channels).values({\n\t\tid: 'UC1',\n\t\tuserId: OWNER.id,\n\t\torgId: 'org-1',\n\t\ttitle: 'One',\n\t\trefreshTokenEnc: 'encrypted-refresh-token',\n\t\tcursor: '2026-01-01T00:00:00Z',\n\t\tlastRunAt: '2026-07-30T00:00:00Z'\n\t});\n\n\tconst data = await loadDashboard();\n\n\texpect(data.chs).toHaveLength(1);\n\texpect(data.chs[0]).toMatchObject({\n\t\tid: 'UC1',\n\t\ttitle: 'One',\n\t\tcursor: '2026-01-01T00:00:00Z',\n\t\tlastRunAt: '2026-07-30T00:00:00Z'\n\t});\n\texpect(data.chs[0]).not.toHaveProperty('refreshTokenEnc'
