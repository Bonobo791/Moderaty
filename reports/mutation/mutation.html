);\n\texpect(JSON.stringify(data)).not.toContain('encrypted-refresh-token');\n});\n\ntest('dashboard load shows only the active team\\'s channels', async () => {\n\tawait testDb().db.insert(channels).values({ id: 'UC1', userId: OWNER.id, orgId: 'org-1', title: 'Mine', refreshTokenEnc: 'enc' });\n\t// A teammate's connection is the team's channel too — it MUST appear.\n\tawait testDb().db.insert(channels).values({ id: 'UC2', userId: 'user-2', orgId: 'org-1', title: 'Teammate', refreshTokenEnc: 'enc' });\n\t// Another team's channel must not leak in.\n\tawait testDb().db.insert(channels).values({ id: 'UC3', userId: 'user-2', orgId: 'org-2', title: 'Theirs', refreshTokenEnc: 'enc' });\n\n\tconst data = await loadDashboard();\n\n\texpect(data.chs.map((ch) => ch.id)).toEqual(['UC1', 'UC2']);\n\t// A healthy load is explicitly NOT the maintenance overlay.\n\texpect(data.maintenance).toBe(false);\n});\n\ntest('dashboard load returns empty stats and bans when the team has no channels', async () => {\n\tconst data = await loadDashboard();\n\n\texpect(data.chs).toEqual([]);\n\texpect(data.stats).toEqual([]);\n\texpect(data.bans).toEqual([]);\n});\n\ntest('dashboard load counts comments by status and ban events only, scoped to the team', async () => {\n\tawait testDb().db.insert(channels).values({ id: 'UC1', userId: OWNER.id, orgId: 'org-1', title: 'Mine', refreshTokenEnc: 'enc' });\n\tawait testDb().db.insert(channels).values({ id: 'UC3', userId: 'user-2', orgId: 'org-2', title: 'Theirs', refreshTokenEnc: 'enc' });\n\tconst comment = (id: string, channelId: string, status: string) =>\n\t\ttestDb().db.insert(comments).values({ id, channelId, text: 'hi', publishedAt: '2026-07-01T00:00:00Z', status, decidedBy: 'ai' });\n\tawait comment('c1', 'UC1', 'approved');\n\tawait comment('c2', 'UC1', 'approved');\n\tawait comment('c3', 'UC1', 'held');\n\t// Another team's comments must not leak into the counts.\n\tawait comment('c4', 'UC3', 'approved');\n\tawait comment('c5', 'UC3', 'approved');\n\tconst audit = (channelId: string, commentId: string, action: string) =>\n\t\ttestDb().db.insert(auditLog).values({ channelId, commentId, action, reason: 'r', actor: 'system' });\n\tawait audit('UC1', 'c1', 'ban');\n\tawait audit('UC1', 'c2', 'ban');\n\t// Non-ban actions — including dry-run rows — are never ban events.\n\tawait audit('UC1', 'c3', 'dry-run');\n\tawait audit('UC1', 'c3', 'reject');\n\t// Another team's bans must not leak into the counts.\n\tawait audit('UC3', 'c4', 'ban');\n\n\tconst data = await loadDashboard();\n\n\texpect(data.stats).toHaveLength(2);\n\texpect(data.stats).toContainEqual({ channelId: 'UC1', status: 'approved', n: 2 });\n\texpect(data.stats).toContainEqual({ channelId: 'UC1', status: 'held', n: 1 });\n\texpect(data.bans).toEqual([{ channelId: 'UC1', n: 2 }]);\n});\n\ntest('dashboard load rejects a signed-out request with 401', async () => {\n\tawait expect(loadDashboard(null)).rejects.toMatchObject({ status: 401 });\n});\n\ntest('dashboard load projects the protection flags for each channel', async () => {\n\tawait testDb().db.insert(channels).values({\n\t\tid: 'UC1',\n\t\tuserId: OWNER.id,\n\t\torgId: 'org-1',\n\t\ttitle: 'Mine',\n\t\trefreshTokenEnc: 'enc',\n\t\tprotectLgbtqia: 1,\n\t\tprotectWomen: 0\n\t});\n\n\tconst data = await loadDashboard();\n\n\texpect(data.chs[0]).toMatchObject({ protectLgbtqia: 1, protectWomen: 0 });\n});\n\ntest('delete account rejects a signed-out request with 401', async () => {\n\tconst { res } = await captureDelete(null, { confirm: 'on' });\n\texpect(res).toMatchObject({ status: 401 });\n});\n\ntest('delete account without the confirmation checkbox writes nothing', async () => {\n\tawait seedActiveUser();\n\n\tconst { res } = await captureDelete(OWNER, {});\n\n\texpect(res).toMatchObject({\n\t\tstatus: 400,\n\t\tdata: { error: 'You must confirm account deletion to continue.' }\n\t});\n\tawait expectAccountUntouched();\n});\n\ntest('delete account rolls everything back when the erase transaction fails', async () => {\n\tawait seedActiveUser();\n\tstubRevocation();\n\t// Force a delete inside the transaction to fail, proving the erase commits\n\t// as one unit: without the transaction the user would keep a live session\n\t// on a tombstoned account.\n\tawait testDb().client.execute(\n\t\t`CREATE TRIGGER fail_session_delete BEFORE DELETE ON sessions BEGIN SELECT RAISE(ABORT, 'simulated session deletion failure'); END;`\n\t);\n\tlet outcome: Awaited<"+"ReturnType<"+"typeof captureDelete>>;\n\ttry {\n\t\toutcome = await captureDelete(OWNER, { confirm: 'on' });\n\t} finally {\n\t\t// The test db is shared across tests — never leak the failure trigger.\n\t\tawait testDb().client.execute('DROP TRIGGER fail_session_delete');\n\t}\n\n\t// Fails loudly: the action rejects (SvelteKit turns that into a 500 with a\n\t// generic message), it does not redirect, and the session cookie stays.\n\texpect(outcome.res).toBeInstanceOf(Error);\n\texpect(outcome.res).not.toMatchObject({ status: 302 });\n\texpect(outcome.cookies.deleteCalls).toHaveLength(0);\n\t// Nothing partial persists: no tombstone, session and channel untouched.\n\tawait expectAccountUntouched();\n});\n\ntest('delete account revokes each channel at Google, erases everything, and signs out', async () => {\n\tawait seedActiveUser();\n\tconst fetch = stubRevocation();\n\n\tconst { res, cookies } = await captureDelete(OWNER, { confirm: 'on' });\n\n\texpect(res).toMatchObject({ status: 302, location: '/' });\n\t// Revocation used the DECRYPTED refresh token of the owned channel.\n\texpect(decryptMock).toHaveBeenCalledWith('enc');\n\texpect(fetch).toHaveBeenCalledWith(\n\t\t'https://oauth2.googleapis.com/revoke',\n\t\texpect.objectContaining({ method: 'POST' })\n\t);\n\texpect(String(fetch.mock.calls[0][1].body)).toContain('token=refresh-token');\n\t// Immediate deletion: channels and sessions are GONE (not deactivated),\n\t// and the user row is a fully anonymized tombstone.\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n\texpect(await testDb().db.select().from(sessions).all()).toHaveLength(0);\n\texpect((await testDb().db.select().from(users).all())[0]).toMatchObject({\n\t\tgoogleSub: 'deleted:user-1',\n\t\temail: '[deleted]',\n\t\tdisplayName: '[deleted]'\n\t});\n\texpect(cookies.deleteCalls).toContainEqual({ name: 'moderaty_session', opts: { path: '/' } });\n});\n\ntest('delete account still deletes when revocation fails, logging loudly', async () => {\n\tawait seedActiveUser();\n\tstubRevocation(false); // Google answers 500\n\tconst errorSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\n\tconst { res } = await captureDelete(OWNER, { confirm: 'on' });\n\n\texpect(res).toMatchObject({ status: 302, location: '/' });\n\texpect(errorSpy).toHaveBeenCalled();\n\t// The revocation request is logged with its channel-scoped prefix so the\n\t// orphaned grant can be traced.\n\texpect(errorSpy).toHaveBeenCalledWith(\n\t\texpect.stringContaining('account deletion channel UC1 revocation failed')\n\t);\n\t// The encrypted token is erased either way — the grant is orphaned, not kept.\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n\texpect((await testDb().db.select().from(users).all())[0]).toMatchObject({ googleSub: 'deleted:user-1' });\n});\n\ntest('a revocation failure on one channel does not stop the others', async () => {\n\tawait seedActiveUser();\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC2', userId: OWNER.id, orgId: 'org-1', title: 'Second', refreshTokenEnc: 'enc2', active: 1 });\n\tdecryptMock.mockImplementation((enc: string) => (enc === 'enc2' ? 'token-2' : 'token-1'));\n\t// Google answers 500 for the first channel's token, 200 for the second.\n\tconst fetch = vi.fn().mockImplementation((_url: string, init?: RequestInit) =>\n\t\tPromise.resolve(new Response('', { status: String(init?.body).includes('token=token-1') ? 500 : 200 }))\n\t);\n\tvi.stubGlobal('fetch', fetch);\n\tconst errorSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\n\ttry {\n\t\tconst { res } = await captureDelete(OWNER, { confirm: 'on' });\n\n\t\texpect(res).toMatchObject({ status: 302, location: '/' });\n\t\t// The failure is logged loudly WITH the channel id…\n\t\texpect(errorSpy).toHaveBeenCalledWith(expect.stringContaining('UC1'), expect.anything());\n\t\t// …and the second channel was still revoked afterwards.\n\t\texpect(fetch.mock.calls.some((c) => String(c[1]?.body).includes('token=token-2'))).toBe(true);\n\t\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n\t\texpect((await testDb().db.select().from(users).all())[0]).toMatchObject({ googleSub: 'deleted:user-1' });\n\t} finally {\n\t\t// The decrypt mock is module-level — restore the default for other tests.\n\t\tdecryptMock.mockImplementation(() => 'refresh-token');\n\t}\n});\n\ntest('a database outage returns the maintenance payload without requiring a user', async () => {\n\t// dbDown with a null user is the normal outage shape: requireUser must not\n\t// trip — the overlay replaces the dashboard, not the error page.\n\tconst data = (await load({ locals: { user: null, dbDown: true } } as never)) as Record<"+"string, unknown>;\n\texpect(data).toEqual({ chs: [], stats: [], bans: [], maintenance: true });\n});\n\ntest('a database failure mid-load degrades to the maintenance payload and logs loudly', async () => {\n\tawait seedActiveUser();\n\tvi.spyOn(console, 'error').mockImplementation(() => {});\n\tconst client = testDb().client;\n\tconst originalExecute = client.execute.bind(client);\n\tclient.execute = (() => Promise.reject(new Error('hrana 502: connect to upstream failed'))) as never;\n\tlet data: Record<"+"string, unknown>;\n\ttry {\n\t\tdata = (await load({ locals: { user: OWNER } } as never)) as Record<"+"string, unknown>;\n\t} finally {\n\t\tclient.execute = originalExecute;\n\t}\n\texpect(data).toEqual({ chs: [], stats: [], bans: [], maintenance: true });\n\texpect(console.error).toHaveBeenCalledWith('dashboard load failed:', expect.any(Error));\n});\n\ntest('a deliberate HttpError mid-load propagates instead of degrading to maintenance', async () => {\n\tawait seedActiveUser();\n\tconst errorSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\t// Capture a real HttpError (what a downstream helper throws on purpose).\n\tlet httpError: unknown;\n\ttry {\n\t\terror(418, 'teapot');\n\t} catch (e) {\n\t\thttpError = e;\n\t}\n\t// A direct throw from the db layer is NOT wrapped by drizzle (unlike a\n\t// rejected client promise, which surfaces as DrizzleQueryError).\n\tconst selectSpy = vi.spyOn(testDb().db, 'select').mockImplementation(() => {\n\t\tthrow httpError;\n\t});\n\ttry {\n\t\tawait expect(load({ locals: { user: OWNER } } as never)).rejects.toBe(httpError);\n\t} finally {\n\t\tselectSpy.mockRestore();\n\t\terrorSpy.mockRestore();\n\t}\n\t// Not swallowed, not logged as an outage.\n\texpect(errorSpy).not.toHaveBeenCalled();\n});\n"},"src/routes/(app)/channels/[id]/log/actions.test.ts":{"tests":[{"id":"103","name":"undo restores a rejected comment at YouTube and records the restore"},{"id":"104","name":"undo of a ban restores the comment and names the original action"},{"id":"105","name":"undo on a deleted comment 404s and changes nothing"},{"id":"106","name":"a YouTube failure releases the claim and fails loudly"},{"id":"107","name":"a dry run records a dry-run audit row and makes no YouTube call"},{"id":"108","name":"a failed audit insert leaves the undo retryable in a restoring state"},{"id":"109","name":"undo rejects a signed-out request with 401"},{"id":"110","name":"undo on another team's channel 404s without leaking existence"},{"id":"111","name":"undo without a comment id fails with 400"},{"id":"112","name":"a whitespace-only comment id is trimmed away and fails with 400"},{"id":"113","name":"undo with no prior audit row still restores and names the generic action"},{"id":"114","name":"a concurrent undo that loses the atomic claim 404s instead of double-restoring"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { beforeEach, expect, test, vi } from 'vitest';\nimport { TEST_OWNER, postForm, setupTestDb, testDb } from '$lib/server/testdb';\nimport { auditLog, channels, comments } from '$lib/server/db/schema';\nimport { eq } from 'drizzle-orm';\n\nconst mocks = vi.hoisted(() => ({\n\tenv: { DRY_RUN: 'false' } as Record<"+"string, string | undefined>,\n\tdecrypt: vi.fn((_enc: string) => 'decrypted-refresh-token'),\n\trefreshAccessToken: vi.fn(async (_token: string) => 'access-token'),\n\tsetModerationStatus: vi.fn(async () => {})\n}));\n\nvi.mock('$env/dynamic/private', () => ({ env: mocks.env }));\nvi.mock('$lib/server/crypto', () => ({ decrypt: mocks.decrypt }));\nvi.mock('$lib/server/youtube', () => ({\n\trefreshAccessToken: mocks.refreshAccessToken,\n\tsetModerationStatus: mocks.setModerationStatus\n}));\n\nimport { actions } from './+page.server';\n\nsetupTestDb(['audit_log', 'comments', 'channels']);\n\nconst OWNER = TEST_OWNER;\nconst LOG_URL = 'http://localhost/channels/UC1/log';\n\nbeforeEach(async () => {\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC1', userId: OWNER.id, orgId: 'org-1', title: 'One', refreshTokenEnc: 'enc-1' });\n\tmocks.env.DRY_RUN = 'false';\n\tvi.clearAllMocks();\n});\n\nasync function seedComment(id: string, status: string, priorAction: string, channelId = 'UC1') {\n\tawait testDb().db.insert(comments).values({\n\t\tid,\n\t\tchannelId,\n\t\ttext: 'hello',\n\t\tpublishedAt: '2026-01-01T00:00:00Z',\n\t\tstatus,\n\t\tdecidedBy: 'ai'\n\t});\n\tawait testDb()\n\t\t.db.insert(auditLog)\n\t\t.values({ channelId, commentId: id, action: priorAction, reason: 'ai score 0.91', actor: 'system' });\n}\n\nfunction undo(commentId: string | null, channelId = 'UC1', user: typeof OWNER | null = OWNER) {\n\treturn actions.undo({\n\t\tparams: { id: channelId },\n\t\trequest: postForm(commentId === null ? {} : { commentId }, LOG_URL),\n\t\tlocals: { user }\n\t} as never);\n}\n\nasync function commentRow(id: string) {\n\treturn testDb().db.select().from(comments).where(eq(comments.id, id)).get();\n}\n\ntest('undo restores a rejected comment at YouTube and records the restore', async () => {\n\tawait seedComment('c1', 'rejected', 'reject');\n\n\tconst res = await undo('c1');\n\n\texpect(res).toMatchObject({ success: expect.stringContaining('estored') });\n\t// The restore runs on the OWNED channel's credential, decrypted — a wrong\n\t// or skipped token step fails this test.\n\texpect(mocks.decrypt).toHaveBeenCalledWith('enc-1');\n\texpect(mocks.refreshAccessToken).toHaveBeenCalledWith('decrypted-refresh-token');\n\texpect(mocks.setModerationStatus).toHaveBeenCalledWith(['c1'], 'published', false, 'access-token');\n\texpect(await commentRow('c1')).toMatchObject({ status: 'approved', decidedBy: 'human' });\n\texpect(await testDb().db.select().from(auditLog).all()).toContainEqual(\n\t\texpect.objectContaining({ commentId: 'c1', action: 'restore', reason: 'undo of reject', actor: 'user' })\n\t);\n});\n\ntest('undo of a ban restores the comment and names the original action', async () => {\n\tawait seedComment('c1', 'rejected', 'ban');\n\n\tawait undo('c1');\n\n\texpect(mocks.setModerationStatus).toHaveBeenCalledWith(['c1'], 'published', false, 'access-token');\n\texpect(await commentRow('c1')).toMatchObject({ status: 'approved' });\n\texpect(await testDb().db.select().from(auditLog).all()).toContainEqual(\n\t\texpect.objectContaining({ commentId: 'c1', action: 'restore', reason: 'undo of ban', actor: 'user' })\n\t);\n});\n\ntest('undo on a deleted comment 404s and changes nothing', async () => {\n\tawait seedComment('c1', 'deleted', 'delete');\n\n\tawait expect(undo('c1')).rejects.toMatchObject({\n\t\tstatus: 404,\n\t\tbody: { message: 'reversible comment not found in this channel' }\n\t});\n\n\texpect(await commentRow('c1')).toMatchObject({ status: 'deleted' });\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n\texpect(await testDb().db.select().from(auditLog).all()).toHaveLength(1); // only the seeded row\n});\n\ntest('a YouTube failure releases the claim and fails loudly', async () => {\n\tawait seedComment('c1', 'rejected', 'reject');\n\tmocks.setModerationStatus.mockRejectedValueOnce(new Error('YouTube refused the transition'));\n\n\tawait expect(undo('c1')).rejects.toThrow('YouTube refused the transition');\n\n\t// Back to the pre-undo state, so the action stays retryable.\n\texpect(await commentRow('c1')).toMatchObject({ status: 'rejected', decidedBy: 'ai' });\n\texpect(await testDb().db.select().from(auditLog).all()).toHaveLength(1);\n});\n\ntest('a dry run records a dry-run audit row and makes no YouTube call', async () => {\n\tmocks.env.DRY_RUN = 'true';\n\tawait seedComment('c1', 'held', 'hold');\n\n\tawait undo('c1');\n\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n\texpect(await commentRow('c1')).toMatchObject({ status: 'approved', decidedBy: 'human' });\n\texpect(await testDb().db.select().from(auditLog).all()).toContainEqual(\n\t\texpect.objectContaining({ commentId: 'c1', action: 'dry-run', reason: 'undo of hold', actor: 'user' })\n\t);\n});\n\ntest('a failed audit insert leaves the undo retryable in a restoring state', async () => {\n\tawait seedComment('c1', 'rejected', 'reject');\n\t// The remote restore succeeds but the audit-row transaction fails.\n\tawait testDb().client.execute(\n\t\t`CREATE TRIGGER fail_audit_insert BEFORE INSERT ON audit_log\n\t\t WHEN NEW.action = 'restore' BEGIN SELECT RAISE(ABORT, 'simulated audit insert failure'); END`\n\t);\n\ttry {\n\t\tawait expect(undo('c1')).rejects.toThrow(/Failed query|simulated audit insert failure/);\n\t} finally {\n\t\tawait testDb().client.execute('DROP TRIGGER fail_audit_insert');\n\t}\n\n\t// Not lost, not half-recorded: the comment parks in 'restoring' with NO\n\t// audit row yet, so the undo can be retried instead of 404ing forever.\n\texpect(await commentRow('c1')).toMatchObject({ status: 'restoring' });\n\texpect((await testDb().db.select().from(auditLog).all()).filter((row) => row.action === 'restore')).toHaveLength(0);\n\n\t// The retry re-applies the (idempotent) YouTube call and completes.\n\tconst res = await undo('c1');\n\n\texpect(res).toMatchObject({ success: expect.stringContaining('estored') });\n\texpect(mocks.setModerationStatus).toHaveBeenCalledTimes(2);\n\texpect(await commentRow('c1')).toMatchObject({ status: 'approved', decidedBy: 'human' });\n\texpect(await testDb().db.select().from(auditLog).all()).toContainEqual(\n\t\texpect.objectContaining({ commentId: 'c1', action: 'restore', reason: 'undo of reject', actor: 'user' })\n\t);\n});\n\ntest('undo rejects a signed-out request with 401', async () => {\n\tawait expect(undo('c1', 'UC1', null)).rejects.toMatchObject({ status: 401 });\n});\n\ntest('undo on another team\\'s channel 404s without leaking existence', async () => {\n\t// The caller personally connected UC2 — under a different team. The org\n\t// gate must still 404 it (a per-user check would wrongly pass here).\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC2', userId: OWNER.id, orgId: 'org-2', title: 'Two', refreshTokenEnc: 'enc-2' });\n\tawait seedComment('c9', 'rejected', 'reject', 'UC2');\n\n\tawait expect(undo('c9', 'UC2')).rejects.toMatchObject({ status: 404 });\n\texpect(await commentRow('c9')).toMatchObject({ status: 'rejected' });\n\texpect(mocks.setModerationStatus).not.toHaveBeenCalled();\n});\n\ntest('undo without a comment id fails with 400', async () => {\n\tconst res = await undo(null);\n\texpect(res).toMatchObject({ status: 400, data: { error: 'Invalid comment ID' } });\n});\n\ntest('a whitespace-only comment id is trimmed away and fails with 400', async () => {\n\tconst res = await undo('   ');\n\texpect(res).toMatchObject({ status: 400, data: { error: 'Invalid comment ID' } });\n});\n\ntest('undo with no prior audit row still restores and names the generic action', async () => {\n\t// A comment can be held without any hold/reject/ban audit row (e.g. history\n\t// predating the log); the undo must still land with a sensible reason.\n\tawait testDb().db.insert(comments).values({\n\t\tid: 'c1',\n\t\tchannelId: 'UC1',\n\t\ttext: 'hello',\n\t\tpublishedAt: '2026-01-01T00:00:00Z',\n\t\tstatus: 'held',\n\t\tdecidedBy: 'ai'\n\t});\n\n\tconst res = await undo('c1');\n\n\texpect(res).toMatchObject({ success: expect.stringContaining('estored') });\n\texpect(await commentRow('c1')).toMatchObject({ status: 'approved', decidedBy: 'human' });\n\texpect(await testDb().db.select().from(auditLog).all()).toContainEqual(\n\t\texpect.objectContaining({ commentId: 'c1', action: 'restore', reason: 'undo of moderation action', actor: 'user' })\n\t);\n});\n\ntest('a concurrent undo that loses the atomic claim 404s instead of double-restoring', async () => {\n\tawait seedComment('c1', 'rejected', 'reject');\n\n\t// Both submissions read status='rejected' before either claims; the\n\t// conditional claim update makes exactly one winner (I3/I4).\n\tconst [first, second] = await Promise.allSettled([undo('c1'), undo('c1')]);\n\n\tconst outcomes = [first, second];\n\texpect(outcomes.filter((r) => r.status === 'fulfilled')).toHaveLength(1);\n\tconst losers = outcomes.filter((r) => r.status === 'rejected');\n\texpect(losers).toHaveLength(1);\n\texpect((losers[0] as PromiseRejectedResult).reason).toMatchObject({\n\t\tstatus: 404,\n\t\tbody: { message: 'reversible comment not found in this channel' }\n\t});\n\t// One remote restore, one audit row, final state approved.\n\texpect(mocks.setModerationStatus).toHaveBeenCalledTimes(1);\n\texpect(await commentRow('c1')).toMatchObject({ status: 'approved', decidedBy: 'human' });\n\texpect((await testDb().db.select().from(auditLog).all()).filter((row) => row.action === 'restore')).toHaveLength(1);\n});\n"},"src/routes/api/cron/cron.test.ts":{"tests":[{"id":"115","name":"rejects a request with no secret at all"},{"id":"116","name":"rejects a wrong secret in both query and header"},{"id":"117","name":"rejects length-mismatched secrets without throwing a 500"},{"id":"118","name":"fails loudly when CRON_SECRET is not configured"},{"id":"119","name":"rejects a malformed Authorization header even with a valid query secret"},{"id":"120","name":"rejects a non-Bearer scheme even when its tail is the secret"},{"id":"121","name":"accepts the 'plan-documented query secret for manu…'"},{"id":"122","name":"accepts the 'Authorization bearer secret without a…'"},{"id":"123","name":"runs the channel with a server-side deadline inside the caller abort window"},{"id":"124","name":"holds a 10-minute lease during the run and reports the result under the channel id"},{"id":"125","name":"exits cleanly when the atomic claim matches 0 rows (concurrent claimant)"},{"id":"126","name":"does not select or claim a channel whose lease is still held"},{"id":"127","name":"does not select a paused (inactive) channel"},{"id":"128","name":"selects the least-recently-run channel first"},{"id":"129","name":"records the run afterwards: lastRunAt is set and the lease is cleared"},{"id":"130","name":"a failing channel run reports failure, never success"},{"id":"131","name":"erases consent e-mails older than 10 years, keeping the anonymized row"},{"id":"132","name":"a sweep failure is reported and does not stop the channel run"},{"id":"133","name":"a dry run skips the consent e-mail sweep entirely (I8)"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { beforeEach, expect, test, vi } from 'vitest';\nimport { eq } from 'drizzle-orm';\nimport { DAY_MS, seedConsent as seedConsentRecord, seedUser, setupTestDb, testDb } from '$lib/server/testdb';\nimport { channels, consents } from '$lib/server/db/schema';\nimport { CONSENT_EMAIL_RETENTION_MS } from '$lib/server/deletion';\n\n// Synthetic credential fixture — same maintainer-approved exception as\n// netlify/cron.test.mjs (2026-07-30, PR #13 review, per AGENTS.md).\nconst mocks = vi.hoisted(() => ({\n\tenv: { CRON_SECRET: 'test-secret', DRY_RUN: 'true' } as Record<"+"string, string | undefined>,\n\trunChannel: vi.fn()\n}));\n\nvi.mock('$env/dynamic/private', () => ({ env: mocks.env }));\nvi.mock('$lib/server/pipeline', () => ({ runChannel: mocks.runChannel }));\n\nimport { GET } from './+server';\n\nsetupTestDb(['channels', 'users', 'consents']);\n\n/** Seeds a user with a consent record accepted at `createdAt`, e-mail retained. */\nasync function seedConsent(id: string, createdAt: string) {\n\tawait seedUser(id);\n\tawait seedConsentRecord(id, createdAt, '1.0');\n}\n\nbeforeEach(() => {\n\tmocks.env.CRON_SECRET = 'test-secret';\n\tmocks.env.DRY_RUN = 'true';\n\tvi.clearAllMocks();\n});\n\nfunction call(secret?: { query?: string; bearer?: string }) {\n\tconst url = new URL('http://localhost/api/cron');\n\tif (secret?.query !== undefined) url.searchParams.set('secret', secret.query);\n\tconst headers: Record<"+"string, string> = {};\n\tif (secret?.bearer !== undefined) headers.authorization = `Bearer ${secret.bearer}`;\n\treturn GET({ url, request: new Request(url, { headers }) } as never);\n}\n\nasync function expectUnauthorized(secret?: { query?: string; bearer?: string }) {\n\t// Exact message: a 401 with an empty or wrong message stayed green in the\n\t// mutation audit (StringLiteral '' on 'bad secret').\n\tawait expect(call(secret)).rejects.toMatchObject({ status: 401, body: { message: 'bad secret' } });\n}\n\ntest('rejects a request with no secret at all', async () => {\n\tawait expectUnauthorized();\n});\n\ntest('rejects a wrong secret in both query and header', async () => {\n\tawait expectUnauthorized({ query: 'wrong' });\n\tawait expectUnauthorized({ bearer: 'wrong' });\n});\n\ntest('rejects length-mismatched secrets without throwing a 500', async () => {\n\tawait expectUnauthorized({ bearer: 'x' });\n\tawait expectUnauthorized({ bearer: 'test-secret-but-longer' });\n\tawait expectUnauthorized({ bearer: 'test-secrex' });\n});\n\ntest('fails loudly when CRON_SECRET is not configured', async () => {\n\tdelete mocks.env.CRON_SECRET;\n\n\t// Exact message: an emptied message stayed green in the mutation audit —\n\t// \"fail loudly\" means a clear message, not just any 500.\n\tawait expect(call({ bearer: 'anything' })).rejects.toMatchObject({\n\t\tstatus: 500,\n\t\tbody: { message: 'CRON_SECRET is not configured' }\n\t});\n});\n\ntest('rejects a malformed Authorization header even with a valid query secret', async () => {\n\tconst url = new URL('http://localhost/api/cron?secret=test-secret');\n\tconst request = new Request(url, { headers: { authorization: 'Basic anything' } });\n\n\tawait expect(GET({ url, request } as never)).rejects.toMatchObject({\n\t\tstatus: 401,\n\t\tbody: { message: 'bad secret' }\n\t});\n});\n\ntest('rejects a non-Bearer scheme even when its tail is the secret', async () => {\n\t// Mutation audit: dropping the 'Bearer ' scheme check (startsWith→true or\n\t// the literal→'') stayed green because every malformed header happened to\n\t// slice to a wrong secret. A 7-character scheme prefix ('Digest ', same\n\t// length as 'Bearer ') whose tail IS the secret must still fail closed —\n\t// only the Bearer scheme authenticates.\n\tconst url = new URL('http://localhost/api/cron');\n\tconst request = new Request(url, { headers: { authorization: 'Digest test-secret' } });\n\n\tawait expect(GET({ url, request } as never)).rejects.toMatchObject({\n\t\tstatus: 401,\n\t\tbody: { message: 'bad secret' }\n\t});\n});\n\nconst SECRET_FORMS = [\n\t{ label: 'plan-documented query secret for manual triggers', secret: { query: 'test-secret' } },\n\t{ label: 'Authorization bearer secret without a query param', secret: { bearer: 'test-secret' } }\n];\n\ntest.each(SECRET_FORMS)('accepts the $label', async ({ secret }) => {\n\tconst res = await call(secret);\n\n\texpect(res.status).toBe(200);\n\texpect(await res.json()).toMatchObject({ ok: true, results: {} });\n});\n\ntest('runs the channel with a server-side deadline inside the caller abort window', async () => {\n\tawait testDb().db.insert(channels).values({ id: 'UC1', title: 'One', refreshTokenEnc: 'enc' });\n\tconst before = Date.now();\n\n\tawait call({ bearer: 'test-secret' });\n\n\texpect(mocks.runChannel).toHaveBeenCalledWith('UC1', expect.objectContaining({\n\t\t// The scheduled function aborts at 25s; the server must stop before that.\n\t\tdeadline: expect.any(Number)\n\t}));\n\tconst deadline = mocks.runChannel.mock.calls[0][1].deadline;\n\tconst windowMs = deadline - before;\n\texpect(windowMs).toBeGreaterThanOrEqual(19_000);\n\texpect(windowMs).toBeLessThanOrEqual(21_000);\n});\n\ntest('holds a 10-minute lease during the run and reports the result under the channel id', async () => {\n\t// Mutation audit: the claim's lease timestamp and the success body's\n\t// results map were never asserted — flipping `Date.now() + LEASE_MS` to\n\t// `-` (an already-expired lease, defeating the crash-recovery window) and\n\t// emptying `results` both stayed green.\n\tawait testDb().db.insert(channels).values({ id: 'UC1', title: 'One', refreshTokenEnc: 'enc' });\n\tconst result = { fetched: 0, acted: 0, queued: 0, partial: false, skipped: false, dryRun: true };\n\tlet leaseDuringRun: string | null = null;\n\tmocks.runChannel.mockImplementation(async () => {\n\t\tleaseDuringRun =\n\t\t\t(await testDb().db.select().from(channels).where(eq(channels.id, 'UC1')).get())\n\t\t\t\t?.leaseExpiresAt ?? null;\n\t\treturn result;\n\t});\n\tconst before = Date.now();\n\n\tconst res = await call({ bearer: 'test-secret' });\n\tconst after = Date.now();\n\n\texpect(await res.json()).toMatchObject({ ok: true, results: { UC1: result } });\n\t// The lease must be held for the whole run and expire ~10 minutes out —\n\t// long enough to outlast one bounded run, self-expiring after a crash.\n\tconst leaseMs = Date.parse(leaseDuringRun ?? '');\n\tconst TEN_MIN_MS = 10 * 60 * 1000;\n\texpect(leaseMs).toBeGreaterThanOrEqual(before + TEN_MIN_MS - 1000);\n\texpect(leaseMs).toBeLessThanOrEqual(after + TEN_MIN_MS + 1000);\n});\n\ntest('exits cleanly when the atomic claim matches 0 rows (concurrent claimant)', async () => {\n\t// Mutation audit: the claimed:false early return was never executed, so\n\t// forcing `claimed.length === 0` to false survived — a losing claimant\n\t// would run the channel anyway, duplicating moderation work.\n\t// A BEFORE UPDATE trigger with RAISE(IGNORE) silently skips the claim row\n\t// (0 rows updated, no error) — the exact post-select race outcome.\n\tawait testDb().db.insert(channels).values({ id: 'UC-race', title: 'Race', refreshTokenEnc: 'enc' });\n\tawait testDb().client.execute(\n\t\t`CREATE TRIGGER ignore_channel_claim BEFORE UPDATE ON channels\n\t\t WHEN NEW.lease_expires_at IS NOT NULL\n\t\t BEGIN SELECT RAISE(IGNORE); END`\n\t);\n\ttry {\n\t\tconst res = await call({ bearer: 'test-secret' });\n\n\t\texpect(await res.json()).toMatchObject({ ok: true, claimed: false, results: {} });\n\t\texpect(mocks.runChannel).not.toHaveBeenCalled();\n\t} finally {\n\t\tawait testDb().client.execute('DROP TRIGGER ignore_channel_claim');\n\t}\n});\n\ntest('does not select or claim a channel whose lease is still held', async () => {\n\t// Mutation audit: flipping the lease comparison (lt→gt) stayed green\n\t// because no test ever set leaseExpiresAt — the lease would become an\n\t// anti-lock, letting concurrent invocations process the same channel.\n\tconst futureLease = new Date(Date.now() + 10 * 60 * 1000).toISOString();\n\tawait testDb().db.insert(channels).values({ id: 'UC-leased', title: 'Leased', refreshTokenEnc: 'enc', leaseExpiresAt: futureLease });\n\n\tconst res = await call({ bearer: 'test-secret' });\n\n\texpect(await res.json()).toMatchObject({ ok: true, results: {} });\n\texpect(mocks.runChannel).not.toHaveBeenCalled();\n});\n\ntest('does not select a paused (inactive) channel', async () => {\n\t// Mutation audit: dropping the active=1 filter stayed green because every\n\t// seeded channel defaults to active — a channel the user paused would be\n\t// moderated anyway, against explicit user intent.\n\tawait testDb().db.insert(channels).values({ id: 'UC-paused', title: 'Paused', refreshTokenEnc: 'enc', active: 0 });\n\n\tconst res = await call({ bearer: 'test-secret' });\n\n\texpect(await res.json()).toMatchObject({ ok: true, results: {} });\n\texpect(mocks.runChannel).not.toHaveBeenCalled();\n});\n\ntest('selects the least-recently-run channel first', async () => {\n\t// Mutation audit: asc→desc on lastRunAt stayed green with single-channel\n\t// fixtures — newest-first lets one hot channel starve the rest (I10).\n\tawait testDb().db.insert(channels).values({ id: 'UC-old', title: 'Old', refreshTokenEnc: 'enc', lastRunAt: '2026-01-01T00:00:00.000Z' });\n\tawait testDb().db.insert(channels).values({ id: 'UC-new', title: 'New', refreshTokenEnc: 'enc', lastRunAt: '2026-08-01T00:00:00.000Z' });\n\tmocks.runChannel.mockResolvedValue({ fetched: 0, acted: 0, queued: 0, partial: false, skipped: false, dryRun: true });\n\n\tawait call({ bearer: 'test-secret' });\n\n\texpect(mocks.runChannel).toHaveBeenCalledWith('UC-old', expect.anything());\n});\n\ntest('records the run afterwards: lastRunAt is set and the lease is cleared', async () => {\n\t// Mutation audit: dropping lastRunAt from the finally-update stayed green —\n\t// the just-run channel would keep sorting first (SQLite ASC, NULLs first)\n\t// and starve every other channel.\n\tawait testDb().db.insert(channels).values({ id: 'UC1', title: 'One', refreshTokenEnc: 'enc' });\n\tmocks.runChannel.mockResolvedValue({ fetched: 0, acted: 0, queued: 0, partial: false, skipped: false, dryRun: true });\n\n\tawait call({ bearer: 'test-secret' });\n\n\tconst row = await testDb().db.select().from(channels).where(eq(channels.id, 'UC1')).get();\n\texpect(row?.lastRunAt).not.toBeNull();\n\texpect(row?.leaseExpiresAt).toBeNull();\n});\n\ntest('a failing channel run reports failure, never success', async () => {\n\t// Mutation audit: no test made runChannel reject, so the failure path\n\t// returning ok:true / 200 stayed green — monitoring would see a failing\n\t// channel as healthy (the code comment's exact warning).\n\tawait testDb().db.insert(channels).values({ id: 'UC-bad', title: 'Bad', refreshTokenEnc: 'enc' });\n\tmocks.runChannel.mockRejectedValue(new Error('youtube quota exhausted'));\n\tconst errorSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\n\ttry {\n\t\tconst res = await call({ bearer: 'test-secret' });\n\n\t\texpect(res.status).toBe(500);\n\t\texpect(await res.json()).toMatchObject({ ok: false, results: { 'UC-bad': { error: 'youtube quota exhausted' } } });\n\t\t// The failure is logged loudly with the channel id (an emptied log\n\t\t// message stayed green in the mutation audit).\n\t\texpect(errorSpy).toHaveBeenCalledWith('channel run UC-bad failed:', expect.any(Error));\n\t\t// The run is still recorded, so a failing channel cannot starve the others.\n\t\tconst row = await testDb().db.select().from(channels).where(eq(channels.id, 'UC-bad')).get();\n\t\texpect(row?.lastRunAt).not.toBeNull();\n\t\texpect(row?.leaseExpiresAt).toBeNull();\n\t} finally {\n\t\t// Restore the spy — a lingering console.error mock leaks into later tests.\n\t\terrorSpy.mockRestore();\n\t}\n});\n\ntest('erases consent e-mails older than 10 years, keeping the anonymized row', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tconst oldDate = new Date(Date.now() - CONSENT_EMAIL_RETENTION_MS - DAY_MS).toISOString();\n\tconst recentDate = new Date(Date.now() - 30 * DAY_MS).toISOString();\n\tawait seedConsent('old', oldDate);\n\tawait seedConsent('recent', recentDate);\n\n\tconst res = await call({ bearer: 'test-secret' });\n\n\texpect(await res.json()).toMatchObject({ ok: true, consentEmailsNulled: 1 });\n\tconst rows = await testDb().db.select().from(consents).all();\n\texpect(rows).toHaveLength(2);\n\t// The ROW is kept (doc version, checkbox text, timestamps) — anonymized evidence.\n\texpect(rows.find((row) => row.userId === 'old')).toMatchObject({ email: null, docVersion: '1.0' });\n\texpect(rows.find((row) => row.userId === 'recent')).toMatchObject({ email: 'recent@example.com' });\n});\n\ntest('a sweep failure is reported and does not stop the channel run', async () => {\n\tmocks.env.DRY_RUN = 'false';\n\tconst oldDate = new Date(Date.now() - CONSENT_EMAIL_RETENTION_MS - DAY_MS).toISOString();\n\tawait seedConsent('old', oldDate);\n\tawait testDb().db.insert(channels).values({ id: 'UC-live', title: 'Live', refreshTokenEnc: 'enc' });\n\tmocks.runChannel.mockResolvedValue({ fetched: 0, acted: 0, queued: 0, partial: false, skipped: false, dryRun: false });\n\tawait testDb().client.execute(\n\t\t`CREATE TRIGGER fail_consent_update BEFORE UPDATE ON consents\n\t\t BEGIN SELECT RAISE(ABORT, 'simulated sweep failure'); END`\n\t);\n\tconst errorSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\ttry {\n\t\tconst res = await call({ bearer: 'test-secret' });\n\n\t\texpect(res.status).toBe(200);\n\t\tconst body = await res.json();\n\t\texpect(body.sweepError).toEqual(expect.stringContaining('Failed query'));\n\t\texpect(body.consentEmailsNulled).toBe(0);\n\t\texpect(mocks.runChannel).toHaveBeenCalledWith('UC-live', expect.objectContaining({ deadline: expect.any(Number) }));\n\t\t// The sweep failure is logged loudly (an emptied log message stayed\n\t\t// green in the mutation audit).\n\t\texpect(errorSpy).toHaveBeenCalledWith('consent e-mail retention sweep failed:', expect.any(Error));\n\t} finally {\n\t\terrorSpy.mockRestore();\n\t\tawait testDb().client.execute('DROP TRIGGER fail_consent_update');\n\t}\n\n\t// The failed sweep changed nothing, so the next invocation retries it.\n\texpect((await testDb().db.select().from(consents).all())[0].email).toBe('old@example.com');\n});\n\ntest('a dry run skips the consent e-mail sweep entirely (I8)', async () => {\n\tconst oldDate = new Date(Date.now() - CONSENT_EMAIL_RETENTION_MS - DAY_MS).toISOString();\n\tawait seedConsent('old', oldDate);\n\t// The skipped sweep is announced loudly (an emptied/removed notice stayed\n\t// green in the mutation audit).\n\tconst infoSpy = vi.spyOn(console, 'info').mockImplementation(() => {});\n\n\ttry {\n\t\tconst res = await call({ bearer: 'test-secret' });\n\n\t\texpect(await res.json()).toMatchObject({ ok: true, dryRun: true, consentEmailsNulled: 0 });\n\t\texpect(infoSpy).toHaveBeenCalledWith('dry run: consent e-mail retention sweep skipped');\n\t} finally {\n\t\tinfoSpy.mockRestore();\n\t}\n\texpect((await testDb().db.select().from(consents).all())[0].email).toBe('old@example.com');\n});\n"},"src/lib/server/youtube.test.ts":{"tests":[{"id":"134","name":"stops pagination after the third page"},{"id":"135","name":"stops pagination when a comment is older than the cursor"},{"id":"136","name":"compares the cursor by instant, not lexicographically"},{"id":"137","name":"rejects a cursor that is not a valid timestamp"},{"id":"138","name":"returns the complete comment text for moderation"},{"id":"139","name":"normalizes missing author metadata instead of failing the page"},{"id":"140","name":"skips a malformed comment without failing the page"},{"id":"141","name":"batches moderation-status updates into groups of fifty"},{"id":"142","name":"restores a comment by posting moderationStatus=published without banAuthor"},{"id":"143","name":"sends banAuthor=true when banning a comment author"},{"id":"144","name":"posts the moderation update and fails loudly on a non-OK response"},{"id":"145","name":"deletes a comment with a DELETE request and tolerates an already-deleted comment"},{"id":"146","name":"fails loudly when a comment delete is rejected"},{"id":"147","name":"requests new comments in time order for the watched channel"},{"id":"148","name":"returns a comment moderation status for recovery verification"},{"id":"149","name":"treats a missing comment as absent during recovery verification"},{"id":"150","name":"parses each comment's video ID for tone context"},{"id":"151","name":"falls back to the thread video ID when the comment snippet lacks one"},{"id":"152","name":"keeps a comment with no video ID so omni and rules still moderate it"},{"id":"153","name":"fetches video metadata in batches of fifty"},{"id":"154","name":"truncates long video descriptions for the tone prompt"},{"id":"155","name":"skips malformed video metadata items without failing the batch"},{"id":"156","name":"fails loudly when the videos.list request fails"},{"id":"157","name":"does not warn for a fully-populated comment"},{"id":"158","name":"rejects a commentThreads response without an items array"},{"id":"159","name":"rejects a structurally malformed comment thread null"},{"id":"160","name":"rejects a structurally malformed comment thread 42"},{"id":"161","name":"rejects a structurally malformed comment thread []"},{"id":"162","name":"rejects a structurally malformed comment thread {\"snippet\":null}"},{"id":"163","name":"rejects a structurally malformed comment thread {\"snippet\":42}"},{"id":"164","name":"rejects a structurally malformed comment thread {\"snippet\":[]}"},{"id":"165","name":"rejects a structurally malformed comment thread {\"snippet\":{}}"},{"id":"166","name":"rejects a structurally malformed comment thread {\"snippet\":{\"topLevelComment\":{}}}"},{"id":"167","name":"skips a comment with a missing or invalid id without failing the page"},{"id":"168","name":"skips a comment with a missing or invalid threadId without failing the page"},{"id":"169","name":"skips a comment with a missing or invalid publishedAt without failing the page"},{"id":"170","name":"skips a comment with a missing or invalid validDate without failing the page"},{"id":"171","name":"normalizes an empty string videoId to null and warns"},{"id":"172","name":"normalizes a number videoId to null and warns"},{"id":"173","name":"does not trip the cursor boundary on a pre-1970 comment when no cursor is set"},{"id":"174","name":"normalizes a string authorChannelId to empty and warns"},{"id":"175","name":"normalizes a number authorChannelId to empty and warns"},{"id":"176","name":"normalizes an array authorChannelId to empty and warns"},{"id":"177","name":"normalizes an explicit null authorChannelId to empty and warns"},{"id":"178","name":"warns loudly for each missing author field"},{"id":"179","name":"sends an authenticated request without a page token by default"},{"id":"180","name":"sends the provided page token for checkpoint resumes"},{"id":"181","name":"treats an explicit null nextPageToken as the end of the list"},{"id":"182","name":"rejects a non-string nextPageToken instead of echoing it back to YouTube"},{"id":"183","name":"rejects a commentThreads response that is not a JSON object"},{"id":"184","name":"requests exactly one videos.list batch for fifty IDs"},{"id":"185","name":"rejects a videos.list response without an items array"},{"id":"186","name":"rejects a videos.list response that is not a JSON object"},{"id":"187","name":"defaults a missing or non-string video description to empty"},{"id":"188","name":"skips a video item with a missing title and logs the failing field"},{"id":"189","name":"skips a video item with a empty title and logs the failing field"},{"id":"190","name":"skips a video item with a non-string title and logs the failing field"},{"id":"191","name":"skips a malformed video item {\"snippet\":{\"title\":\"T\"}} and logs the failing field"},{"id":"192","name":"skips a malformed video item {\"id\":\"x\"} and logs the failing field"},{"id":"193","name":"posts exactly one moderation batch for fifty comment IDs"},{"id":"194","name":"returns the heldForReview moderation status during recovery verification"},{"id":"195","name":"returns the published moderation status during recovery verification"},{"id":"196","name":"returns the likelySpam moderation status during recovery verification"},{"id":"197","name":"returns the rejected moderation status during recovery verification"},{"id":"198","name":"fails loudly on an unsupported moderation status"},{"id":"199","name":"returns null when the comment is absent from the list"},{"id":"200","name":"fails loudly when comments.list returns multiple comments"},{"id":"201","name":"fails loudly when comments.list items is missing"},{"id":"202","name":"fails loudly when a comments.list response is not a JSON object"},{"id":"203","name":"fails loudly when moderationStatus is missing from the comment"},{"id":"204","name":"fails loudly when the comment entry is malformed: [null]"},{"id":"205","name":"fails loudly when the comment entry is malformed: [{}]"},{"id":"206","name":"fails loudly when the comments.list request fails"},{"id":"207","name":"fails loudly when a commentThreads page is not valid JSON"},{"id":"208","name":"refreshAccessToken fails loudly when GOOGLE_CLIENT_ID is not configured"},{"id":"209","name":"refreshAccessToken fails loudly when GOOGLE_CLIENT_SECRET is not configured"},{"id":"210","name":"refreshAccessToken fails loudly when both is not configured"},{"id":"211","name":"refreshAccessToken posts the refresh grant to the Google token endpoint"},{"id":"212","name":"refreshAccessToken fails loudly when the token endpoint rejects the grant"},{"id":"213","name":"refreshAccessToken fails loudly when the token response is not JSON"},{"id":"214","name":"refreshAccessToken fails loudly when the token response is not a JSON object"},{"id":"215","name":"refreshAccessToken fails loudly when the token response lacks an access token"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { afterEach, beforeEach, expect, test, vi } from 'vitest';\n\nconst mocks = vi.hoisted(() => ({\n\tenv: {\n\t\tGOOGLE_CLIENT_ID: 'client-id',\n\t\tGOOGLE_CLIENT_SECRET: 'client-secret'\n\t} as Record<"+"string, string | undefined>\n}));\n\nvi.mock('$env/dynamic/private', () => ({ env: mocks.env }));\n\nimport { deleteComment, fetchNewComments, fetchVideoMetadata, getCommentModerationStatus, refreshAccessToken, setModerationStatus } from './youtube';\n\nbeforeEach(() => {\n\tmocks.env.GOOGLE_CLIENT_ID = 'client-id';\n\tmocks.env.GOOGLE_CLIENT_SECRET = 'client-secret';\n});\n\nfunction comment(id: string, publishedAt: string, text = `Comment ${id}`) {\n\treturn {\n\t\tid: `thread-${id}`,\n\t\tsnippet: {\n\t\t\ttopLevelComment: {\n\t\t\t\tid,\n\t\t\t\tsnippet: {\n\t\t\t\t\tvideoId: `video-${id}`,\n\t\t\t\t\tauthorChannelId: { value: `author-${id}` },\n\t\t\t\t\tauthorDisplayName: `Author ${id}`,\n\t\t\t\t\ttextDisplay: text,\n\t\t\t\t\tpublishedAt\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t};\n}\n\nfunction page(items: ReturnType<"+"typeof comment>[], nextPageToken?: string) {\n\treturn new Response(JSON.stringify({\n\t\titems,\n\t\t...(nextPageToken ? { nextPageToken } : {})\n\t}), { status: 200 });\n}\n\n/** Stubs fetch with the given commentThread pages, captures warnings, and runs one fetch. */\nasync function fetchComments(...pages: Response[]) {\n\tconst fetch = vi.fn();\n\tfor (const response of pages) fetch.mockResolvedValueOnce(response);\n\tvi.stubGlobal('fetch', fetch);\n\tconst warn = vi.spyOn(console, 'warn').mockImplementation(() => {});\n\tconst result = await fetchNewComments('channel', 'token', null);\n\treturn { result, warn };\n}\n\nafterEach(() => {\n\tvi.unstubAllGlobals();\n\tvi.restoreAllMocks();\n});\n\ntest('stops pagination after the third page', async () => {\n\tconst fetch = vi.fn()\n\t\t.mockResolvedValueOnce(page([comment('1', '2026-01-04T00:00:00.000Z')], 'page-2'))\n\t\t.mockResolvedValueOnce(page([comment('2', '2026-01-03T00:00:00.000Z')], 'page-3'))\n\t\t.mockResolvedValueOnce(page([comment('3', '2026-01-02T00:00:00.000Z')], 'page-4'));\n\tvi.stubGlobal('fetch', fetch);\n\n\tconst result = await fetchNewComments('channel', 'token', null);\n\n\texpect(fetch).toHaveBeenCalledTimes(3);\n\texpect(result.comments.map((item) => item.id)).toEqual(['1', '2', '3']);\n\texpect(result).toMatchObject({ nextPageToken: 'page-4', reachedCursor: false });\n});\n\ntest('stops pagination when a comment is older than the cursor', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(page([\n\t\tcomment('new', '2026-01-04T00:00:00.000Z'),\n\t\tcomment('old', '2026-01-01T00:00:00.000Z')\n\t], 'page-2'));\n\tvi.stubGlobal('fetch', fetch);\n\n\tconst result = await fetchNewComments('channel', 'token', '2026-01-02T00:00:00.000Z');\n\n\texpect(fetch).toHaveBeenCalledTimes(1);\n\texpect(result.comments.map((item) => item.id)).toEqual(['new']);\n\texpect(result).toMatchObject({ nextPageToken: null, reachedCursor: true });\n});\n\ntest('compares the cursor by instant, not lexicographically', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(page([\n\t\tcomment('same-instant', '2026-01-02T00:00:00.000Z'),\n\t\tcomment('older-offset', '2026-01-01T20:00:00-02:00')\n\t], 'page-2'));\n\tvi.stubGlobal('fetch', fetch);\n\n\tconst result = await fetchNewComments('channel', 'token', '2026-01-02T00:00:00Z');\n\n\texpect(fetch).toHaveBeenCalledTimes(1);\n\texpect(result.comments.map((item) => item.id)).toEqual(['same-instant']);\n\texpect(result).toMatchObject({ nextPageToken: null, reachedCursor: true });\n});\n\ntest('rejects a cursor that is not a valid timestamp', async () => {\n\tawait expect(fetchNewComments('channel', 'token', 'not-a-date')).rejects.toThrow(\n\t\t'fetchNewComments cursor is invalid: not-a-date'\n\t);\n});\n\ntest('returns the complete comment text for moderation', async () => {\n\tconst text = 'x'.repeat(501);\n\tconst fetch = vi.fn().mockResolvedValue(page([\n\t\tcomment('long', '2026-01-04T00:00:00.000Z', text)\n\t]));\n\tvi.stubGlobal('fetch', fetch);\n\n\tconst result = await fetchNewComments('channel', 'token', null);\n\n\texpect(result.comments[0]?.text).toBe(text);\n});\n\ntest('normalizes missing author metadata instead of failing the page', async () => {\n\tconst deletedAuthor = comment('deleted', '2026-01-04T00:00:00.000Z');\n\tdelete (deletedAuthor.snippet.topLevelComment.snippet as Record<"+"string, unknown>).authorChannelId;\n\tdelete (deletedAuthor.snippet.topLevelComment.snippet as Record<"+"string, unknown>).authorDisplayName;\n\n\tconst { result, warn } = await fetchComments(page([\n\t\tdeletedAuthor,\n\t\tcomment('normal', '2026-01-03T00:00:00.000Z')\n\t]));\n\n\texpect(result.comments.map((item) => item.id)).toEqual(['deleted', 'normal']);\n\texpect(result.comments[0]).toMatchObject({ authorChannelId: '', authorName: '[unavailable author]' });\n\texpect(warn).toHaveBeenCalled();\n});\n\ntest('skips a malformed comment without failing the page', async () => {\n\tconst malformed = comment('malformed', '2026-01-04T00:00:00.000Z');\n\tdelete (malformed.snippet.topLevelComment.snippet as Record<"+"string, unknown>).textDisplay;\n\n\tconst { result, warn } = await fetchComments(\n\t\tpage([malformed, comment('normal', '2026-01-03T00:00:00.000Z')], 'page-2'),\n\t\tpage([comment('next', '2026-01-02T00:00:00.000Z')])\n\t);\n\n\texpect(result.comments.map((item) => item.id)).toEqual(['normal', 'next']);\n\texpect(result).toMatchObject({ nextPageToken: null, reachedCursor: false });\n\texpect(warn).toHaveBeenCalled();\n});\n\ntest('batches moderation-status updates into groups of fifty', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(new Response(null, { status: 204 }));\n\tvi.stubGlobal('fetch', fetch);\n\tconst ids = Array.from({ length: 101 }, (_, index) => `comment-${index + 1}`);\n\n\tawait setModerationStatus(ids, 'rejected', false, 'token');\n\n\texpect(fetch).toHaveBeenCalledTimes(3);\n\tconst batches = fetch.mock.calls.map(([url]) => new URL(String(url)).searchParams.get('id')!.split(','));\n\texpect(batches).toEqual([ids.slice(0, 50), ids.slice(50, 100), ids.slice(100)]);\n});\n\ntest('restores a comment by posting moderationStatus=published without banAuthor', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(new Response(null, { status: 204 }));\n\tvi.stubGlobal('fetch', fetch);\n\n\tawait setModerationStatus(['comment'], 'published', false, 'token');\n\n\tconst url = new URL(String(fetch.mock.calls[0]?.[0]));\n\texpect(url.searchParams.get('moderationStatus')).toBe('published');\n\t// banAuthor is only valid alongside 'rejected' — a restore must omit it.\n\texpect(url.searchParams.get('banAuthor')).toBeNull();\n\texpect(url.searchParams.get('id')).toBe('comment');\n});\n\ntest('sends banAuthor=true when banning a comment author', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(new Response(null, { status: 204 }));\n\tvi.stubGlobal('fetch', fetch);\n\n\tawait setModerationStatus(['comment'], 'rejected', true, 'token');\n\n\tconst url = new URL(String(fetch.mock.calls[0]?.[0]));\n\t// Dropping this parameter silently degrades every ban to a plain reject.\n\texpect(url.searchParams.get('banAuthor')).toBe('true');\n\texpect(url.searchParams.get('moderationStatus')).toBe('rejected');\n});\n\ntest('posts the moderation update and fails loudly on a non-OK response', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(new Response('forbidden', { status: 403 }));\n\tvi.stubGlobal('fetch', fetch);\n\n\t// A failed write must throw — otherwise the pipeline confirms an action\n\t// YouTube never enforced (I3).\n\tawait expect(setModerationStatus(['comment'], 'rejected', false, 'token')).rejects.toThrow(\n\t\t'setModerationStatus failed: 403 forbidden'\n\t);\n\texpect(fetch.mock.calls[0]?.[1]).toMatchObject({ method: 'POST'
