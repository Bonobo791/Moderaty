# Report-only mutation testing on every PR: Stryker mutates the src files
# changed vs main (git-diff-driven --mutate scope; StrykerJS has no --since
# flag) and uploads the HTML/JSON report as an artifact.
# This NEVER fails on surviving mutants — there is deliberately no
# thresholds.break (ratcheting a gate is a separate, maintainer-approved step
# per AGENTS.md). The check only goes red if Stryker itself errors, which is a
# real signal (broken config, broken suite, missing tsconfig).

name: Mutation report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The mutate scope diffs against the merge base; the default
          # shallow clone has no history to diff against.
          fetch-depth: 0

      # PR checkouts are detached HEAD with only origin/* refs; the diff
      # needs a LOCAL main ref to compare against, so create it explicitly.
      - run: git fetch origin main:main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: no dependency needs its lifecycle script here
      # (esbuild's binaries arrive via optionalDependencies; fsevents is
      # macOS-only) — don't give the registry a code-execution path in CI.
      - run: npm ci --ignore-scripts

      # Stryker's vitest runner needs the generated .svelte-kit/tsconfig.json;
      # without it the run crashes with a rolldown "Tsconfig not found" error.
      # Invoke the local binary directly — npx can fetch and execute
      # unverified packages on demand.
      - run: ./node_modules/.bin/svelte-kit sync

      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.head_ref }}
          restore-keys: |
            stryker-incremental-${{ github.head_ref }}
            stryker-incremental-main
            stryker-incremental-

      # Scope the run to the src files this PR changes, computed by the
      # shared script so CI and the documented local commands cannot drift
      # (CLI --mutate OVERRIDES the config's mutate globs). A docs-only PR
      # produces an empty scope and the run is skipped loudly.
      - name: Compute changed source files
        id: scope
        run: |
          SCOPE=$(node scripts/stryker-pr-scope.mjs)
          echo "mutate=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Changed source files to mutate: ${SCOPE:-<none>}"

      - name: Stryker mutation report
        if: steps.scope.outputs.mutate != ''
        run: ./node_modules/.bin/stryker run --mutate "${{ steps.scope.outputs.mutate }}" --incremental --reporters html,json,clear-text

      - name: Skip notice when nothing mutable changed
        if: steps.scope.outputs.mutate == ''
        run: echo "::notice::No mutable src files changed vs main; mutation run skipped."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          if-no-files-found: warn
