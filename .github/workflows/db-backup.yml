# Activation and secrets are deliberately separate owner-controlled gates.
# No GitHub artifacts/caches are permitted for database payloads.
name: db-backup

permissions:
  contents: read

on:
  schedule:
    - cron: '23 3 * * *' # Daily 03:23 UTC; default branch only.
  workflow_dispatch:

concurrency:
  group: database-backup-production
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.BACKUP_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-backups
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install checksum-pinned backup tools
        run: bash scripts/install-backup-tools.sh
      - name: Validate, encrypt, upload, verify and expire approved backups
        id: run
        env:
          BACKUP_PRODUCTION_ENABLED: ${{ vars.BACKUP_PRODUCTION_ENABLED }}
          BACKUP_SCOPE: ${{ vars.BACKUP_SCOPE }}
          BACKUP_DATABASE_NAME: ${{ vars.BACKUP_DATABASE_NAME }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_EXPECTED_DATABASE_HOST: ${{ vars.BACKUP_EXPECTED_DATABASE_HOST }}
          BACKUP_DATABASE_AUTH_TOKEN: ${{ secrets.BACKUP_DATABASE_AUTH_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCOUNT_ID: ${{ vars.BACKUP_S3_ACCOUNT_ID }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.BACKUP_AWS_SESSION_TOKEN }}
          BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: node scripts/run-backup.mjs "$BACKUP_DATABASE_NAME"
      - name: Report setup failure
        if: failure() && steps.run.outcome != 'failure'
        env:
          BACKUP_SCOPE: ${{ vars.BACKUP_SCOPE }}
          BACKUP_ALERT_WEBHOOK_URL: ${{ secrets.BACKUP_ALERT_WEBHOOK_URL }}
        run: node --input-type=module -e "import { notify } from './scripts/backup-lib/alerts.mjs'; import { reportError } from './scripts/backup-lib/common.mjs'; try { await notify({ stage:'configuration' }); } catch (e) { reportError(e); }"
