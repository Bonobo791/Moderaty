 } }]\n\t}));\n\tvi.stubGlobal('fetch', fetch);\n\tconst warn = vi.spyOn(console, 'warn').mockImplementation(() => {});\n\n\tconst result = await fetchVideoMetadata(['bad'], 'token');\n\n\texpect(result.has('bad')).toBe(false);\n\texpect(warn).toHaveBeenCalledWith(\n\t\t'videos.list response item is malformed; skipping it:',\n\t\t'videos.list response item 0',\n\t\texpect.objectContaining({\n\t\t\tmessage: expect.stringContaining('videos.list response item 0.snippet.title is missing or invalid')\n\t\t})\n\t);\n});\n\ntest.each([\n\t[{ snippet: { title: 'T' } }, 'videos.list response item 0.id is missing or invalid'],\n\t[{ id: 'x' }, 'videos.list response item 0.snippet is missing or invalid']\n])('skips a malformed video item %j and logs the failing field', async (item, message) => {\n\tconst fetch = vi.fn().mockResolvedValue(rawPage({ items: [item] }));\n\tvi.stubGlobal('fetch', fetch);\n\tconst warn = vi.spyOn(console, 'warn').mockImplementation(() => {});\n\n\tconst result = await fetchVideoMetadata(['x'], 'token');\n\n\texpect(result.has('x')).toBe(false);\n\texpect(warn).toHaveBeenCalledWith(\n\t\t'videos.list response item is malformed; skipping it:',\n\t\t'videos.list response item 0',\n\t\texpect.objectContaining({ message: expect.stringContaining(message) })\n\t);\n});\n\ntest('posts exactly one moderation batch for fifty comment IDs', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(new Response(null, { status: 204 }));\n\tvi.stubGlobal('fetch', fetch);\n\tconst ids = Array.from({ length: 50 }, (_, index) => `comment-${index + 1}`);\n\n\tawait setModerationStatus(ids, 'heldForReview', false, 'token');\n\n\texpect(fetch).toHaveBeenCalledTimes(1);\n});\n\ntest.each(['heldForReview', 'published', 'likelySpam', 'rejected'] as const)(\n\t'returns the %s moderation status during recovery verification',\n\tasync (status) => {\n\t\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({\n\t\t\titems: [{ snippet: { moderationStatus: status } }]\n\t\t})));\n\n\t\tawait expect(getCommentModerationStatus('comment', 'token')).resolves.toBe(status);\n\t}\n);\n\ntest('fails loudly on an unsupported moderation status', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({\n\t\titems: [{ snippet: { moderationStatus: 'spam' } }]\n\t})));\n\n\t// An unknown status must never be silently treated as a confirmed action (I2).\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(\n\t\t'comments.list response moderationStatus is unsupported: spam'\n\t);\n});\n\ntest('returns null when the comment is absent from the list', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({ items: [] })));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).resolves.toBeNull();\n});\n\ntest('fails loudly when comments.list returns multiple comments', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({\n\t\titems: [{ snippet: { moderationStatus: 'rejected' } }, { snippet: { moderationStatus: 'rejected' } }]\n\t})));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(\n\t\t'comments.list response returned multiple comments'\n\t);\n});\n\ntest('fails loudly when comments.list items is missing', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({})));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(\n\t\t'comments.list response items is missing or invalid'\n\t);\n});\n\ntest('fails loudly when a comments.list response is not a JSON object', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('[]', { status: 200 })));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(\n\t\t'comments.list response is missing or invalid'\n\t);\n});\n\ntest('fails loudly when moderationStatus is missing from the comment', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({ items: [{ snippet: {} }] })));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(\n\t\t'comments.list response moderationStatus is missing or invalid'\n\t);\n});\n\ntest.each([\n\t[[null], 'comments.list response item is missing or invalid'],\n\t[[{}], 'comments.list response item snippet is missing or invalid']\n])('fails loudly when the comment entry is malformed: %j', async (items, message) => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({ items })));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(message);\n});\n\ntest('fails loudly when the comments.list request fails', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('bad request', { status: 400 })));\n\n\tawait expect(getCommentModerationStatus('comment', 'token')).rejects.toThrow(\n\t\t'comments.list failed: 400 bad request'\n\t);\n});\n\ntest('fails loudly when a commentThreads page is not valid JSON', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('not json', { status: 200 })));\n\n\tawait expect(fetchNewComments('channel', 'token', null)).rejects.toThrow(\n\t\t'commentThreads.list returned invalid JSON'\n\t);\n});\n\ntest.each(['GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'both'] as const)(\n\t'refreshAccessToken fails loudly when %s is not configured',\n\tasync (which) => {\n\t\tif (which !== 'GOOGLE_CLIENT_SECRET') mocks.env.GOOGLE_CLIENT_ID = undefined;\n\t\tif (which !== 'GOOGLE_CLIENT_ID') mocks.env.GOOGLE_CLIENT_SECRET = undefined;\n\t\tconst fetch = vi.fn();\n\t\tvi.stubGlobal('fetch', fetch);\n\n\t\tawait expect(refreshAccessToken('refresh-token')).rejects.toThrow(\n\t\t\t'GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are required'\n\t\t);\n\t\texpect(fetch).not.toHaveBeenCalled();\n\t}\n);\n\ntest('refreshAccessToken posts the refresh grant to the Google token endpoint', async () => {\n\tconst fetch = vi.fn().mockResolvedValue(rawPage({ access_token: 'fresh-token' }));\n\tvi.stubGlobal('fetch', fetch);\n\n\tawait expect(refreshAccessToken('refresh-token')).resolves.toBe('fresh-token');\n\n\texpect(fetch).toHaveBeenCalledTimes(1);\n\tconst [url, init] = fetch.mock.calls[0] as [string, RequestInit];\n\texpect(url).toBe('https://oauth2.googleapis.com/token');\n\texpect(init.method).toBe('POST');\n\texpect(init.headers).toEqual({ 'Content-Type': 'application/x-www-form-urlencoded' });\n\tconst body = String(init.body);\n\texpect(body).toContain('client_id=client-id');\n\texpect(body).toContain('client_secret=client-secret');\n\texpect(body).toContain('refresh_token=refresh-token');\n\texpect(body).toContain('grant_type=refresh_token');\n});\n\ntest('refreshAccessToken fails loudly when the token endpoint rejects the grant', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('invalid_grant', { status: 400 })));\n\n\tawait expect(refreshAccessToken('refresh-token')).rejects.toThrow(\n\t\t'token refresh failed: 400 invalid_grant'\n\t);\n});\n\ntest('refreshAccessToken fails loudly when the token response is not JSON', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('not json', { status: 200 })));\n\n\tawait expect(refreshAccessToken('refresh-token')).rejects.toThrow('token refresh returned invalid JSON');\n});\n\ntest('refreshAccessToken fails loudly when the token response is not a JSON object', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(new Response('[]', { status: 200 })));\n\n\tawait expect(refreshAccessToken('refresh-token')).rejects.toThrow(\n\t\t'token refresh response is missing or invalid'\n\t);\n});\n\ntest('refreshAccessToken fails loudly when the token response lacks an access token', async () => {\n\tvi.stubGlobal('fetch', vi.fn().mockResolvedValue(rawPage({})));\n\n\tawait expect(refreshAccessToken('refresh-token')).rejects.toThrow(\n\t\t'token refresh response access_token is missing or invalid'\n\t);\n});\n"},"src/routes/api/auth/google/callback/callback.test.ts":{"tests":[{"id":"216","name":"a member cannot connect a channel — 403 before any Google call or write"},{"id":"217","name":"a new channel is inserted and attached to the caller"},{"id":"218","name":"a channel already owned by the caller is updated"},{"id":"219","name":"a channel owned by a teammate is updated — the token-handover path"},{"id":"220","name":"a channel owned by another team stays unchanged and yields 409"},{"id":"221","name":"a multi-channel account parks the channels and redirects to the picker without writing anything"},{"id":"222","name":"the channel listing paginates and every valid channel reaches the picker"},{"id":"223","name":"a malformed channel item is skipped and the single valid channel short-circuits to the connect"},{"id":"224","name":"the token exchange uses this flow's redirect URI and the channels listing asks for the caller's channels"},{"id":"225","name":"a non-OK channels status fails loudly with the lookup-failed message"},{"id":"226","name":"an invalid-JSON channels body fails loudly as an invalid YouTube response"},{"id":"227","name":"a non-object channels body fails loudly as an invalid YouTube response"},{"id":"228","name":"a channels body without an items array is an empty account — 400, nothing logged, nothing written"},{"id":"229","name":"a channel without a snippet title is stored as Untitled channel"},{"id":"230","name":"a null channel item is skipped without crashing the walk"},{"id":"231","name":"a non-string nextPageToken stops the listing walk instead of being followed"},{"id":"232","name":"a pathological pageToken loop stops at the page bound and logs the truncation"},{"id":"233","name":"bad state and missing code reject with descriptive 400 messages"},{"id":"234","name":"a failed token exchange surfaces the flow-specific message and log prefix"},{"id":"235","name":"a token exchange without a refresh token rejects before any channels lookup"},{"id":"236","name":"a primitive (string) channels body fails loudly as an invalid YouTube response"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\n// Real-database coverage for the conditional-upsert ownership predicate —\n// the mocked suite in ../oauth.test.ts can only assert that a setWhere was\n// passed, not that it actually blocks a foreign owner.\n\nimport { afterEach, expect, test, vi } from 'vitest';\n\nconst mocks = vi.hoisted(() => ({\n\tenv: {\n\t\tGOOGLE_CLIENT_ID: 'client-id',\n\t\tGOOGLE_CLIENT_SECRET: 'client-secret',\n\t\tAPP_URL: 'http://localhost:5173',\n\t\tENCRYPTION_KEY: 'test-encryption-key'\n\t} as Record<"+"string, string | undefined>\n}));\n\nvi.mock('$env/dynamic/private', () => ({ env: mocks.env }));\n\nimport { TEST_OWNER, setupTestDb, testDb } from '$lib/server/testdb';\nimport { makeCookiesWithState } from '$lib/server/testcookies';\nimport { readPendingChannelPick } from '$lib/server/channelConnect';\nimport { channels } from '$lib/server/db/schema';\nimport type { SessionUser } from '$lib/server/session';\nimport { GET as authCallback } from './+server';\n\nsetupTestDb(['channels']);\n\nconst OWNER = TEST_OWNER;\n\nafterEach(() => {\n\tvi.unstubAllGlobals();\n\tvi.restoreAllMocks();\n});\n\nfunction stubTokenAndChannel() {\n\tvi.stubGlobal(\n\t\t'fetch',\n\t\tvi.fn(async (input: RequestInfo | URL) => {\n\t\t\tconst url = String(input);\n\t\t\tif (url === 'https://oauth2.googleapis.com/token') {\n\t\t\t\treturn new Response(JSON.stringify({ access_token: 'a', refresh_token: 'refresh-token' }), { status: 200 });\n\t\t\t}\n\t\t\tif (url.startsWith('https://www.googleapis.com/youtube/v3/channels')) {\n\t\t\t\treturn new Response(JSON.stringify({ items: [{ id: 'UC123', snippet: { title: 'My Channel' } }] }), {\n\t\t\t\t\tstatus: 200\n\t\t\t\t});\n\t\t\t}\n\t\t\tthrow new Error(`unexpected fetch: ${url}`);\n\t\t})\n\t);\n}\n\n/** Stubs the token exchange plus a custom channels-list response handler. */\nfunction stubTokenAndChannels(listChannels: (url: URL) => Response) {\n\tvi.stubGlobal(\n\t\t'fetch',\n\t\tvi.fn(async (input: RequestInfo | URL) => {\n\t\t\tconst url = String(input);\n\t\t\tif (url === 'https://oauth2.googleapis.com/token') {\n\t\t\t\treturn new Response(JSON.stringify({ access_token: 'a', refresh_token: 'refresh-token' }), { status: 200 });\n\t\t\t}\n\t\t\tif (url.startsWith('https://www.googleapis.com/youtube/v3/channels')) {\n\t\t\t\treturn listChannels(new URL(url));\n\t\t\t}\n\t\t\tthrow new Error(`unexpected fetch: ${url}`);\n\t\t})\n\t);\n}\n\nasync function captureCallback(user: SessionUser | null = OWNER, cookies = makeCookiesWithState('s')) {\n\ttry {\n\t\tawait authCallback({\n\t\t\turl: new URL('http://localhost:5173/api/auth/google/callback?code=abc&state=s'),\n\t\t\tcookies,\n\t\t\tlocals: { user }\n\t\t} as never);\n\t\treturn { thrown: undefined, cookies };\n\t} catch (e) {\n\t\treturn { thrown: e as { status: number; location?: string; body?: { message: string } }, cookies };\n\t}\n}\n\nasync function captureCallbackWithUrl(url: URL, cookies = makeCookiesWithState('s')) {\n\ttry {\n\t\tawait authCallback({ url, cookies, locals: { user: OWNER } } as never);\n\t\treturn { thrown: undefined as undefined | { status: number; location?: string; body?: { message: string } }, cookies };\n\t} catch (e) {\n\t\treturn { thrown: e as { status: number; location?: string; body?: { message: string } }, cookies };\n\t}\n}\n\ntest('a member cannot connect a channel — 403 before any Google call or write', async () => {\n\tconst member: SessionUser = { ...OWNER, orgRole: 'member' };\n\n\tconst { thrown } = await captureCallback(member);\n\n\texpect(thrown).toMatchObject({ status: 403 });\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n});\n\ntest('a new channel is inserted and attached to the caller', async () => {\n\tstubTokenAndChannel();\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302, location: '/dashboard' });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC123', userId: OWNER.id, orgId: 'org-1', title: 'My Channel' });\n\texpect(row?.refreshTokenEnc).not.toBe('refresh-token');\n\t// The scan window starts at connection time: comments published BEFORE the\n\t// channel was connected are never moderated.\n\texpect(row?.cursor).toBeTruthy();\n\texpect(row?.cursor).toBe(row?.createdAt);\n});\n\ntest('a channel already owned by the caller is updated', async () => {\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC123', userId: OWNER.id, orgId: 'org-1', title: 'Old title', refreshTokenEnc: 'old-enc', active: 0 });\n\tstubTokenAndChannel();\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302 });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC123', userId: OWNER.id, orgId: 'org-1', title: 'My Channel', active: 1 });\n\texpect(row?.refreshTokenEnc).not.toBe('old-enc');\n});\n\ntest('a channel owned by a teammate is updated — the token-handover path', async () => {\n\t// Same org, different connector: the re-connect hands the token over to\n\t// the caller while the channel stays in the team.\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC123', userId: 'user-2', orgId: 'org-1', title: 'Old title', refreshTokenEnc: 'old-enc', active: 0 });\n\tstubTokenAndChannel();\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302 });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC123', userId: OWNER.id, orgId: 'org-1', title: 'My Channel', active: 1 });\n\texpect(row?.refreshTokenEnc).not.toBe('old-enc');\n});\n\ntest('a channel owned by another team stays unchanged and yields 409', async () => {\n\tawait testDb()\n\t\t.db.insert(channels)\n\t\t.values({ id: 'UC123', userId: 'user-2', orgId: 'org-2', title: 'Not yours', refreshTokenEnc: 'foreign-enc' });\n\tstubTokenAndChannel();\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(409);\n\texpect(thrown?.body?.message).toBe('this channel is connected to a different Moderaty team');\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC123', userId: 'user-2', orgId: 'org-2', title: 'Not yours', refreshTokenEnc: 'foreign-enc' });\n});\n\ntest('a multi-channel account parks the channels and redirects to the picker without writing anything', async () => {\n\tstubTokenAndChannels(\n\t\t() =>\n\t\t\tnew Response(\n\t\t\t\tJSON.stringify({\n\t\t\t\t\titems: [\n\t\t\t\t\t\t{ id: 'UC1', snippet: { title: 'One' } },\n\t\t\t\t\t\t{ id: 'UC2', snippet: { title: 'Two' } }\n\t\t\t\t\t]\n\t\t\t\t}),\n\t\t\t\t{ status: 200 }\n\t\t\t)\n\t);\n\tconst cookies = makeCookiesWithState('s');\n\n\tconst { thrown } = await captureCallback(OWNER, cookies);\n\n\texpect(thrown).toMatchObject({ status: 302, location: '/connect-channel?state=s' });\n\t// Nothing is connected — the refresh token must not be persisted until a\n\t// channel is chosen.\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n\tconst parked = readPendingChannelPick(cookies as never, 's');\n\texpect(parked?.channels).toEqual([\n\t\t{ id: 'UC1', title: 'One' },\n\t\t{ id: 'UC2', title: 'Two' }\n\t]);\n\texpect(parked?.refreshToken).toBe('refresh-token');\n});\n\ntest('the channel listing paginates and every valid channel reaches the picker', async () => {\n\tconst seenPageTokens: (string | null)[] = [];\n\tstubTokenAndChannels((url) => {\n\t\tseenPageTokens.push(url.searchParams.get('pageToken'));\n\t\tif (!url.searchParams.get('pageToken')) {\n\t\t\treturn new Response(\n\t\t\t\tJSON.stringify({ items: [{ id: 'UC1', snippet: { title: 'One' } }], nextPageToken: 'p2' }),\n\t\t\t\t{ status: 200 }\n\t\t\t);\n\t\t}\n\t\treturn new Response(JSON.stringify({ items: [{ id: 'UC2', snippet: { title: 'Two' } }] }), { status: 200 });\n\t});\n\tconst cookies = makeCookiesWithState('s');\n\n\tconst { thrown } = await captureCallback(OWNER, cookies);\n\n\texpect(seenPageTokens).toEqual([null, 'p2']);\n\texpect(thrown).toMatchObject({ status: 302, location: '/connect-channel?state=s' });\n\texpect(readPendingChannelPick(cookies as never, 's')?.channels).toHaveLength(2);\n});\n\ntest('a malformed channel item is skipped and the single valid channel short-circuits to the connect', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(\n\t\t() =>\n\t\t\tnew Response(\n\t\t\t\tJSON.stringify({\n\t\t\t\t\titems: [{ id: 42 }, { id: 'UC9', snippet: { title: 'Valid' } }]\n\t\t\t\t}),\n\t\t\t\t{ status: 200 }\n\t\t\t)\n\t);\n\n\tconst { thrown, cookies } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302, location: '/dashboard' });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC9', title: 'Valid' });\n\t// The skip is counted and loud, never silent (I1).\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/skipped 1 malformed/);\n\t// No picker was parked for the single-channel path.\n\texpect(readPendingChannelPick(cookies as never, 's')).toBeNull();\n\terrSpy.mockRestore();\n});\n\ntest('the token exchange uses this flow\\'s redirect URI and the channels listing asks for the caller\\'s channels', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tconst calls: Array<"+"{ url: string; init?: RequestInit }> = [];\n\tvi.stubGlobal(\n\t\t'fetch',\n\t\tvi.fn(async (input: RequestInfo | URL, init?: RequestInit) => {\n\t\t\tconst url = String(input);\n\t\t\tcalls.push({ url, init });\n\t\t\tif (url === 'https://oauth2.googleapis.com/token') {\n\t\t\t\treturn new Response(JSON.stringify({ access_token: 'a', refresh_token: 'refresh-token' }), { status: 200 });\n\t\t\t}\n\t\t\tif (url.startsWith('https://www.googleapis.com/youtube/v3/channels')) {\n\t\t\t\treturn new Response(JSON.stringify({ items: [{ id: 'UC123', snippet: { title: 'My Channel' } }] }), {\n\t\t\t\t\tstatus: 200\n\t\t\t\t});\n\t\t\t}\n\t\t\tthrow new Error(`unexpected fetch: ${url}`);\n\t\t})\n\t);\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302, location: '/dashboard' });\n\n\t// The redirect URI must be THIS flow's callback — a wrong path breaks the\n\t// exchange against Google's registered-URI check.\n\tconst tokenCall = calls.find((c) => c.url === 'https://oauth2.googleapis.com/token');\n\tconst tokenBody = new URLSearchParams(String(tokenCall?.init?.body));\n\texpect(tokenBody.get('redirect_uri')).toBe('http://localhost:5173/api/auth/google/callback');\n\n\t// The listing must request the caller's own channels, 50 per page, snippet\n\t// part, authorized with the fresh access token.\n\tconst channelCall = calls.find((c) => c.url.startsWith('https://www.googleapis.com/youtube/v3/channels'));\n\texpect(channelCall, 'channels listing request captured').toBeDefined();\n\tconst channelUrl = new URL(channelCall!.url);\n\texpect(channelUrl.searchParams.get('part')).toBe('snippet');\n\texpect(channelUrl.searchParams.get('mine')).toBe('true');\n\texpect(channelUrl.searchParams.get('maxResults')).toBe('50');\n\texpect(channelUrl.searchParams.get('pageToken')).toBeNull();\n\texpect((channelCall!.init?.headers as Record<"+"string, string>).Authorization).toBe('Bearer a');\n\n\t// Zero malformed items → zero skip logging.\n\texpect(errSpy.mock.calls.flat().join(' ')).not.toMatch(/skipped/);\n});\n\ntest('a non-OK channels status fails loudly with the lookup-failed message', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(() => new Response('quota exceeded', { status: 403 }));\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(502);\n\texpect(thrown?.body?.message).toBe('YouTube channel lookup failed — please retry');\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/youtube channels lookup failed: 403/);\n});\n\ntest('an invalid-JSON channels body fails loudly as an invalid YouTube response', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(() => new Response('this is not json', { status: 200 }));\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(502);\n\texpect(thrown?.body?.message).toBe('invalid response from YouTube — please retry');\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/youtube channels lookup returned invalid JSON: 200/);\n});\n\ntest('a non-object channels body fails loudly as an invalid YouTube response', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(() => new Response('null', { status: 200 }));\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(502);\n\texpect(thrown?.body?.message).toBe('invalid response from YouTube — please retry');\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/youtube channels lookup returned a non-object body: 200/);\n});\n\ntest('a channels body without an items array is an empty account — 400, nothing logged, nothing written', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(() => new Response(JSON.stringify({}), { status: 200 }));\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(400);\n\texpect(thrown?.body?.message).toBe('no YouTube channel found for this Google account');\n\t// A missing items array is NOT a malformed item — nothing is skipped.\n\texpect(errSpy).not.toHaveBeenCalled();\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n});\n\ntest('a channel without a snippet title is stored as Untitled channel', async () => {\n\tvi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(\n\t\t() => new Response(JSON.stringify({ items: [{ id: 'UC123' }] }), { status: 200 })\n\t);\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302, location: '/dashboard' });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC123', title: 'Untitled channel' });\n});\n\ntest('a null channel item is skipped without crashing the walk', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tstubTokenAndChannels(\n\t\t() =>\n\t\t\tnew Response(JSON.stringify({ items: [null, { id: 'UC9', snippet: { title: 'Valid' } }] }), { status: 200 })\n\t);\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown).toMatchObject({ status: 302, location: '/dashboard' });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC9', title: 'Valid' });\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/skipped 1 malformed/);\n});\n\ntest('a non-string nextPageToken stops the listing walk instead of being followed', async () => {\n\tvi.spyOn(console, 'error').mockImplementation(() => {});\n\tlet channelFetches = 0;\n\tstubTokenAndChannels((url) => {\n\t\tchannelFetches++;\n\t\tif (!url.searchParams.get('pageToken')) {\n\t\t\t// I2: a wrong-typed page token is invalid data — never followed.\n\t\t\treturn new Response(\n\t\t\t\tJSON.stringify({ items: [{ id: 'UC1', snippet: { title: 'One' } }], nextPageToken: 123 }),\n\t\t\t\t{ status: 200 }\n\t\t\t);\n\t\t}\n\t\treturn new Response(JSON.stringify({ items: [{ id: 'UC2', snippet: { title: 'Two' } }] }), { status: 200 });\n\t});\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(channelFetches).toBe(1);\n\texpect(thrown).toMatchObject({ status: 302, location: '/dashboard' });\n\tconst row = await testDb().db.select().from(channels).get();\n\texpect(row).toMatchObject({ id: 'UC1', title: 'One' });\n});\n\ntest('a pathological pageToken loop stops at the page bound and logs the truncation', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tlet channelFetches = 0;\n\tstubTokenAndChannels(() => {\n\t\tchannelFetches++;\n\t\treturn new Response(\n\t\t\tJSON.stringify({ items: [{ id: 'UC1', snippet: { title: 'One' } }], nextPageToken: 'more' }),\n\t\t\t{ status: 200 }\n\t\t);\n\t});\n\tconst cookies = makeCookiesWithState('s');\n\n\tconst { thrown } = await captureCallback(OWNER, cookies);\n\n\texpect(channelFetches).toBe(10);\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/hit the 10-page bound/);\n\texpect(thrown).toMatchObject({ status: 302, location: '/connect-channel?state=s' });\n\texpect(readPendingChannelPick(cookies as never, 's')?.channels).toHaveLength(10);\n});\n\ntest('bad state and missing code reject with descriptive 400 messages', async () => {\n\tconst cookies = makeCookiesWithState('s');\n\n\tconst missingState = await captureCallbackWithUrl(\n\t\tnew URL('http://localhost:5173/api/auth/google/callback?code=abc'),\n\t\tcookies\n\t);\n\texpect(missingState.thrown?.status).toBe(400);\n\texpect(missingState.thrown?.body?.message).toBe('bad state');\n\n\tconst forgedState = await captureCallbackWithUrl(\n\t\tnew URL('http://localhost:5173/api/auth/google/callback?code=abc&state=forged'),\n\t\tcookies\n\t);\n\texpect(forgedState.thrown?.status).toBe(400);\n\texpect(forgedState.thrown?.body?.message).toBe('bad state');\n\n\tconst missingCode = await captureCallbackWithUrl(\n\t\tnew URL('http://localhost:5173/api/auth/google/callback?state=s'),\n\t\tcookies\n\t);\n\texpect(missingCode.thrown?.status).toBe(400);\n\texpect(missingCode.thrown?.body?.message).toBe('missing code');\n});\n\ntest('a failed token exchange surfaces the flow-specific message and log prefix', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\tvi.stubGlobal(\n\t\t'fetch',\n\t\tvi.fn(\n\t\t\tasync () =>\n\t\t\t\tnew Response(JSON.stringify({ error: 'invalid_grant', error_description: 'code was already redeemed' }), {\n\t\t\t\t\tstatus: 400\n\t\t\t\t})\n\t\t)\n\t);\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(502);\n\texpect(thrown?.body?.message).toBe('Google token exchange failed — please retry');\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/google token exchange failed: 400 invalid_grant: code was already redeemed/);\n});\n\ntest('a token exchange without a refresh token rejects before any channels lookup', async () => {\n\tvi.spyOn(console, 'error').mockImplementation(() => {});\n\tlet channelFetches = 0;\n\tvi.stubGlobal(\n\t\t'fetch',\n\t\tvi.fn(async (input: RequestInfo | URL) => {\n\t\t\tconst url = String(input);\n\t\t\tif (url === 'https://oauth2.googleapis.com/token') {\n\t\t\t\t// Re-consent case: Google answers 200 without a refresh_token.\n\t\t\t\treturn new Response(JSON.stringify({ access_token: 'a' }), { status: 200 });\n\t\t\t}\n\t\t\tif (url.startsWith('https://www.googleapis.com/youtube/v3/channels')) {\n\t\t\t\tchannelFetches++;\n\t\t\t\treturn new Response(JSON.stringify({ items: [{ id: 'UC1', snippet: { title: 'One' } }] }), {\n\t\t\t\t\tstatus: 200\n\t\t\t\t});\n\t\t\t}\n\t\t\tthrow new Error(`unexpected fetch: ${url}`);\n\t\t})\n\t);\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(400);\n\texpect(thrown?.body?.message).toMatch(/^token exchange returned no refresh_token/);\n\t// The flow must stop here — no lookup, no write with a missing token.\n\texpect(channelFetches).toBe(0);\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n});\n\ntest('a primitive (string) channels body fails loudly as an invalid YouTube response', async () => {\n\tconst errSpy = vi.spyOn(console, 'error').mockImplementation(() => {});\n\t// Valid JSON, but a string — not an object with items. I2: wrong-typed\n\t// external data means the API call failed, never an empty channel list.\n\tstubTokenAndChannels(() => new Response(JSON.stringify('just a string'), { status: 200 }));\n\n\tconst { thrown } = await captureCallback();\n\n\texpect(thrown?.status).toBe(502);\n\texpect(thrown?.body?.message).toBe('invalid response from YouTube — please retry');\n\texpect(errSpy.mock.calls.flat().join(' ')).toMatch(/youtube channels lookup returned a non-object body: 200/);\n\texpect(await testDb().db.select().from(channels).all()).toHaveLength(0);\n});\n"},"src/lib/server/pipeline.test.ts":{"tests":[{"id":"237","name":"categorizes score 0.5 as 'approved'"},{"id":"238","name":"categorizes score 0.51 as 'pending'"},{"id":"239","name":"categorizes score 0.75 as 'pending'"},{"id":"240","name":"categorizes score 0.76 as 'rejected'"},{"id":"241","name":"categorizes score 0.94 as 'rejected'"},{"id":"242","name":"categorizes score 0.95 as 'rejected'"},{"id":"243","name":"validates and compiles each regex rule once per run, not per comment"},{"id":"244","name":"scores with the org-resolved OpenAI key (BYOK), threaded to both scorers"},{"id":"245","name":"routes AI scoring failures to the review queue instead of failing the run (I11)"},{"id":"246","name":"never calls the tone classifier at sensitivity level null"},{"id":"247","name":"never calls the tone classifier at sensitivity level 1"},{"id":"248","name":"rejects a demeaning comment the omni score alone would approve"},{"id":"249","name":"bans the author of a genuinely harmful tone attack (≥0.95)"},{"id":"250","name":"queues a borderline tone score (0.51–0.75)"},{"id":"251","name":"keeps the omni outcome when it is the stronger signal"},{"id":"252","name":"skips the tone call entirely when the omni score already rejects"},{"id":"253","name":"routes tone scoring failures to the review queue (I11)"},{"id":"254","name":"routes video metadata failures to the review queue instead of aborting the run (I11)"},{"id":"255","name":"scores tone with empty context when a comment has no video ID"},{"id":"256","name":"persists the chronologically newest timestamp when UTC offsets differ"},{"id":"257","name":"does not call YouTube moderation or deletion APIs during a dry run"},{"id":"258","name":"reads DRY_RUN from private runtime environment variables"},{"id":"259","name":"forceDryRun previews a live deployment: dry-run audit rows carry the comment text and nothing durable changes"},{"id":"260","name":"forceDryRun can only turn dry-run on — it never flips an env-dry deployment live"},{"id":"261","name":"writes an approval audit entry for a low-risk AI decision"},{"id":"262","name":"scores full comment text but truncates the stored copy"},{"id":"263","name":"stores the comment text but never author identifiers"},{"id":"264","name":"records successful remote actions before a later action fails"},{"id":"265","name":"queues AI scoring failures for human review and never rescores them (I11)"},{"id":"266","name":"verifies a dispatched action after its completion transaction fails"},{"id":"267","name":"completes a dispatched ban when the comment is already terminal ('rejected')"},{"id":"268","name":"completes a dispatched ban when the comment is already terminal (null)"},{"id":"269","name":"retries a dispatched ban while the comment is still public"},{"id":"270","name":"rounds the AI score to 2 decimals before deciding (0.506 → 'pending')"},{"id":"271","name":"rounds the AI score to 2 decimals before deciding (0.504 → 'approved')"},{"id":"272","name":"keeps a dispatched action retriable when verification fails transiently"},{"id":"273","name":"stops without new writes or YouTube calls when account deletion deactivates the channel mid-run"},{"id":"274","name":"does not dispatch staged enforcement when the channel is deactivated after decisions are staged"},{"id":"275","name":"skips a pending action already claimed by a concurrent run"},{"id":"276","name":"decides a duplicated comment id only once when fetch pages overlap"},{"id":"277","name":"rule delete action enforces deleteComment end-to-end"},{"id":"278","name":"rule ban action rejects the comment with banAuthor set"},{"id":"279","name":"rule hold action dispatches heldForReview to YouTube"},{"id":"280","name":"skips an inactive channel without fetching or scoring"},{"id":"281","name":"fails loudly when DRY_RUN is not true or false"},{"id":"282","name":"fails the run after staging when a comment decision throws, without advancing the cursor"},{"id":"283","name":"persists the next page token when the scan is incomplete"},{"id":"284","name":"keeps the existing cursor when the fetched page is empty"},{"id":"285","name":"completes the scan when the cursor is reached even if a page token remains"},{"id":"286","name":"a ticked protection flag forces the tone pass even below sensitivity level 2"},{"id":"287","name":"level 2 passes the persisted protection flags through to the scorer"},{"id":"288","name":"no flags and sensitivity below 2 keeps the tone pass off (no extra AI spend)"},{"id":"289","name":"selects only the columns each lookup needs"},{"id":"290","name":"fails loudly when the channel does not exist"},{"id":"291","name":"treats a vanished channel row as deactivated mid-run, logging and stopping loudly"},{"id":"292","name":"truncates the rule pattern in the stored reason at 80 characters"},{"id":"293","name":"truncates the ai-unavailable reason at 200 characters"},{"id":"294","name":"skips the tone pass at exactly the auto-reject threshold (0.76)"},{"id":"295","name":"keeps the ai signal when the tone score ties it"},{"id":"296","name":"returns a partial result when the deadline hits during comment fetch"},{"id":"297","name":"returns a partial result when the deadline hits during video metadata fetch"},{"id":"298","name":"returns a partial result when the deadline hits during dispatched-action verification"},{"id":"299","name":"verifies a dispatched 'delete' action (observed: null, completed: true)"},{"id":"300","name":"verifies a dispatched 'delete' action (observed: 'rejected', completed: false)"},{"id":"301","name":"verifies a dispatched 'hold' action (observed: 'heldForReview', completed: true)"},{"id":"302","name":"verifies a dispatched 'hold' action (observed: 'published', completed: false)"},{"id":"303","name":"verifies a dispatched 'reject' action (observed: 'rejected', completed: true)"},{"id":"304","name":"verifies a dispatched 'reject' action (observed: null, completed: false)"},{"id":"305","name":"verifies a dispatched 'ban' action (observed: 'rejected', completed: true)"},{"id":"306","name":"verifies a dispatched 'ban' action (observed: null, completed: true)"},{"id":"307","name":"verifies a dispatched 'ban' action (observed: 'published', completed: false)"},{"id":"308","name":"fails loudly on an unknown stored moderation action"},{"id":"309","name":"does not run the claim update when there is nothing pending to claim"},{"id":"310","name":"fetches comments with the stored cursor, page token, and paging options"},{"id":"311","name":"a dry run counts only enforceable decisions as acted"},{"id":"312","name":"a dry run with no new comments writes nothing at all"},{"id":"313","name":"staging inserts no empty action batch for an approved comment"},{"id":"314","name":"applies YouTube moderation in batches of 50"},{"id":"315","name":"fails the run with every per-comment failure joined, each naming its comment"},{"id":"316","name":"keeps the newest timestamp even when it appears first on the page"},{"id":"317","name":"keeps the first timestamp when two comments share one instant"},{"id":"318","name":"a dry run still writes the audit row for an ai 'reject' decision"},{"id":"319","name":"a dry run still writes the audit row for an ai 'ban' decision"}],"source":"// Moderaty — YouTube Comment Auto-Moderation Tool\n// Copyright (C) 2026 Andrew Philip Weilbacher\n//\n// This program is free software: you can redistribute it and/or modify\n// it under the terms of the GNU Affero General Public License as published\n// by the Free Software Foundation, either version 3 of the License, or\n// (at your option) any later version.\n//\n// This program is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE. See the\n// GNU Affero General Public License for more details.\n//\n// You should have received a copy of the GNU Affero General Public License\n// along with this program. If not, see <"+"https://www.gnu.org/licenses/>.\n//\n// Commercial licensing: contact@marketingprowess.simplelogin.com — see COMMERCIAL.md\n\nimport { afterEach, beforeEach, expect, test, vi } from 'vitest';\n\nconst mocks = vi.hoisted(() => {\n\tconst state = {\n\t\tenv: { DRY_RUN: 'false' } as Record<"+"string, string | undefined>,\n\t\ttables: {\n\t\t\tchannels: undefined as unknown,\n\t\t\tcomments: undefined as unknown,\n\t\t\trules: undefined as unknown,\n\t\t\tauditLog: undefined as unknown,\n\t\t\tmoderationActions: undefined as unknown\n\t\t},\n\t\tchannel: {} as Record<"+"string, unknown>,\n\t\tchannelUpdates: [] as Record<"+"string, unknown>[],\n\t\texistingIds: [] as string[],\n\t\tunclaimedIds: [] as string[],\n\t\truleRows: [] as unknown[],\n\t\tinsertedComments: [] as Record<"+"string, unknown>[],\n\t\tinsertedAudits: [] as Record<"+"string, unknown>[],\n\t\tmoderationActions: [] as Record<"+"string, unknown>[]\n\t};\n\tconst store = (table: unknown, values: unknown) => {\n\t\tconst rows = (Array.isArray(values) ? values : [values]) as Record<"+"string, unknown>[];\n\t\tif (table === state.tables.comments) state.insertedComments.push(...rows);\n\t\tif (table === state.tables.auditLog) state.insertedAudits.push(...rows);\n\t\tif (table === state.tables.moderationActions) state.moderationActions.push(...rows);\n\t};\n\tconst query = (table: unknown) => ({\n\t\twhere: (condition?: unknown) => ({\n\t\t\tget: async () => {\n\t\t\t\tif (table === state.tables.channels) return state.channel;\n\t\t\t\tthrow new Error('unexpected get query');\n\t\t\t},\n\t\t\tall: async () => {\n\t\t\t\tif (table === state.tables.comments) {\n\t\t\t\t\t// Honor the inArray(comments.id, ...) condition: a row only counts as\n\t\t\t\t\t// already-stored when the query actually selects its id.\n\t\t\t\t\tconst params = queryParams(condition);\n\t\t\t\t\treturn [...new Set([\n\t\t\t\t\t\t...state.existingIds,\n\t\t\t\t\t\t...state.insertedComments.map((comment) => String(comment.id))\n\t\t\t\t\t])].filter((id) => params.includes(id)).map((id) => ({ id }));\n\t\t\t\t}\n\t\t\t\tif (table === state.tables.rules) return state.ruleRows;\n\t\t\t\tif (table === state.tables.moderationActions) {\n\t\t\t\t\t// Honor eq(channelId, ...) + inArray(state, [...]): only rows whose\n\t\t\t\t\t// channel and state the query actually selects come back.\n\t\t\t\t\tconst params = queryParams(condition);\n\t\t\t\t\treturn state.moderationActions.filter((action) =>\n\t\t\t\t\t\tparams.includes(String(action.channelId)) && params.includes(String(action.state)));\n\t\t\t\t}\n\t\t\t\tthrow new Error('unexpected all query');\n\t\t\t}\n\t\t})\n\t});\n\tconst transaction = {\n\t\tinsert: vi.fn((table: unknown) => ({ values: async (values: unknown) => store(table, values) })),\n\t\tupdate: (table: unknown) => ({\n\t\t\tset: (values: Record<"+"string, unknown>) => ({\n\t\t\t\twhere: (condition?: unknown) => {\n\t\t\t\t\tconst none = { returning: async () => [] as Record<"+"string, unknown>[] };\n\t\t\t\t\tif (table === state.tables.channels) {\n\t\t\t\t\t\tstate.channelUpdates.push(values);\n\t\t\t\t\t\treturn none;\n\t\t\t\t\t}\n\t\t\t\t\tif (table !== state.tables.moderationActions || !('state' in values)) return none;\n\t\t\t\t\tif (values.state === 'dispatched' && !('lastAttemptAt' in values)) {\n\t\t\t\t\t\t// Atomic claim: only pending rows transition, and the claimed ids\n\t\t\t\t\t\t// come back via RETURNING. Ids in unclaimedIds simulate a\n\t\t\t\t\t\t// concurrent run that claimed the row first. The where-clause is\n\t\t\t\t\t\t// honored: ids the query does not select are never claimed, and\n\t\t\t\t\t\t// without eq(state, 'pending') no row transitions at all.\n\t\t\t\t\t\tconst params = queryParams(condition);\n\t\t\t\t\t\tif (!params.includes('pending')) return { returning: async () => [] as Record<"+"string, unknown>[] };\n\t\t\t\t\t\tconst claimed = state.moderationActions.filter((item) =>\n\t\t\t\t\t\t\titem.state === 'pending' &&\n\t\t\t\t\t\t\tparams.includes(String(item.commentId)) &&\n\t\t\t\t\t\t\t!state.unclaimedIds.includes(String(item.commentId)));\n\t\t\t\t\t\tclaimed.forEach((item) => {\n\t\t\t\t\t\t\tObject.assign(item, values);\n\t\t\t\t\t\t});\n\t\t\t\t\t\treturn {\n\t\t\t\t\t\t\treturning: async (fields: unknown) =>\n\t\t\t\t\t\t\t\tfields && typeof fields === 'object' && 'commentId' in fields\n\t\t\t\t\t\t\t\t\t? claimed.map((item) => ({ commentId: item.commentId }))\n\t\t\t\t\t\t\t\t\t: []\n\t\t\t\t\t\t};\n\t\t\t\t\t}\n\t\t\t\t\t// markDispatched / completeActions: honor inArray(commentId, ...) —\n\t\t\t\t\t// only rows whose id the query selects are updated.\n\t\t\t\t\tconst params = queryParams(condition);\n\t\t\t\t\tstate.moderationActions.forEa
