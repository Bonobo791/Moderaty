name: checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, 'feat/secure-database-backups-recovery']

permissions:
  contents: read

jobs:
  agentshield:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - name: AgentShield Security Scan
        run: npm run scan:agents

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Existing scope tests inspect HEAD~5; preserve repository history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run check:e2e
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: npm run test:e2e
