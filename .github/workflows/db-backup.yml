# Daily production database backup. Dumps the `moderaty` Turso database with
# scripts/backup-db.mjs and keeps the gzipped dump as a workflow artifact for
# 30 days. Requires a TURSO_API_TOKEN repository secret (a Turso platform API
# token — mint one with `turso auth api-tokens mint`); without it the dump
# step fails loudly, which is the intended behavior. Restore instructions
# live in DEPLOY.md §6.

name: db-backup

on:
  schedule:
    # Daily at 03:23 UTC — off the top-of-hour herd.
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Pinned version with checksum verification (PR #83 review, CWE-494):
      # never pipe a remote install script to bash in a job that holds
      # TURSO_API_TOKEN. The layout below was verified against the v1.0.31
      # release: checksums.txt is sha256sum-compatible and the tarball holds
      # the `turso` binary at its root.
      - name: Install Turso CLI (pinned, checksum-verified)
        run: |
          set -euo pipefail
          VERSION=v1.0.31
          ASSET=turso-cli_Linux_x86_64.tar.gz
          BASE="https://github.com/tursodatabase/turso-cli/releases/download/$VERSION"
          curl -sSfLO "$BASE/$ASSET"
          curl -sSfLO "$BASE/checksums.txt"
          grep " $ASSET$" checksums.txt | sha256sum -c -
          mkdir -p "$HOME/.turso-bin"
          tar -xzf "$ASSET" -C "$HOME/.turso-bin"
          echo "$HOME/.turso-bin" >> "$GITHUB_PATH"

      - name: Dump production database
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: node scripts/backup-db.mjs moderaty backups

      - name: Upload dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: moderaty-dump-${{ github.run_id }}
          path: backups/*.sql.gz
          retention-days: 30
          # A backup run that produced no file is a failure, not a success.
          if-no-files-found: error
