<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preload" href="/fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/IBMPlexMono-500.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/JetBrainsMono-400.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/JetBrainsMono-500.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
		<!-- Default document title (sonarcloud Web:PageWithoutTitleCheck). It
		     sits AFTER %sveltekit.head% so a page's own <svelte:head><title> is
		     the FIRST <title> in the document (the one browsers use) and can
		     override it; routes that set no title fall back to "Moderaty". -->
		<title>Moderaty</title>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
