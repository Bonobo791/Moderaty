# gh-aw-metadata: {"agent_id":"codex"}
# gh-aw-manifest: {"secrets":["CODEX_API_KEY","OPENAI_API_KEY","GH_AW_GITHUB_TOKEN"]}
# Secrets used:
#   - CODEX_API_KEY
#   - OPENAI_API_KEY
#   - GH_AW_GITHUB_TOKEN
if: github.event.pull_request.head.repo.id == github.event.repository.id
steps:
      - run: check_oauth_tokens.sh
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
      - run: codex exec -c features.shell_tool=false
          printf '%s\n' "::add-mask::$MCP_GATEWAY_AGENT_ID"
